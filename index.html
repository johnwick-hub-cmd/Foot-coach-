<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>⚽ Football Coach IA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#060e06;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#e8f5e8;font-size:16px;-webkit-tap-highlight-color:transparent}
input,button,select{font-family:inherit}
input{width:100%;padding:14px 16px;border-radius:12px;border:1px solid #1a3a1a;background:#0d1a0d;color:#e8f5e8;font-size:16px}
input::placeholder{color:#3a5a3a}
input:focus{outline:none;border-color:#7fff47}
button{cursor:pointer;border:none;font-size:15px}
::-webkit-scrollbar{width:0}
.screen{min-height:100vh;padding:0 20px 40px;max-width:480px;margin:0 auto}
.hidden{display:none!important}
.pill{padding:8px 16px;border-radius:20px;border:1px solid #2a3a2a;background:#111b11;color:#7fff47;font-size:14px;font-weight:500}
.pill.active{border:none;background:#7fff47;color:#0a1a0a;font-weight:700}
.card{background:#0d1a0d;border:1px solid #1a3a1a;border-radius:14px;padding:16px}
.label{color:#3a5a3a;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;display:block;margin-bottom:10px}
.btn-main{width:100%;padding:16px;border-radius:14px;background:#7fff47;color:#060e06;font-size:16px;font-weight:800}
.btn-outline{width:100%;padding:16px;border-radius:14px;background:transparent;border:2px solid #7fff47;color:#7fff47;font-size:16px;font-weight:700}
.btn-ghost{width:100%;padding:13px;border-radius:12px;background:none;border:1px solid #2a5a2a;color:#5a9a5a;font-size:14px;font-weight:700}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
@keyframes su{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.dots{display:flex;gap:6px;padding:14px 0}
.dot{width:10px;height:10px;border-radius:50%;background:#7fff47}
.dot:nth-child(1){animation:pulse 1.2s ease-in-out 0s infinite}
.dot:nth-child(2){animation:pulse 1.2s ease-in-out .2s infinite}
.dot:nth-child(3){animation:pulse 1.2s ease-in-out .4s infinite}
/* Bottom nav */
#bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#060e06;border-top:1px solid #1a2a1a;display:flex;padding:10px 0 22px;z-index:50}
.nav-btn{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0}
.nav-icon{font-size:22px}
.nav-label{font-size:11px;font-weight:700;color:#2a4a2a}
.nav-label.active{color:#7fff47}
.nav-dot{width:5px;height:5px;border-radius:50%;background:#7fff47}
/* Header */
#main-header{position:sticky;top:0;z-index:40;background:#060e06;border-bottom:1px solid #0d1a0d;padding:13px 18px 11px;display:flex;justify-content:space-between;align-items:center;max-width:480px;margin:0 auto}
/* Progress bars */
.progress-bar{height:9px;background:#1a2a1a;border-radius:5px;overflow:hidden;margin:6px 0}
.progress-fill{height:100%;border-radius:5px;transition:width .5s}
/* Session runner */
#runner{position:fixed;inset:0;background:#060e06;z-index:100;overflow-y:auto;max-width:480px;margin:0 auto}
#runner-header{position:sticky;top:0;background:#060e06;border-bottom:1px solid #0d1a0d;padding:14px 18px 10px;z-index:10}
/* Timer */
#timer-box{border-radius:16px;padding:18px 20px;margin-top:14px}
#timer-num{font-size:56px;font-weight:900;text-align:center;line-height:1;font-variant-numeric:tabular-nums}
/* Info modal */
#info-modal{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:200;display:flex;flex-direction:column;justify-content:flex-end}
#info-inner{background:#0a1a0a;border-radius:22px 22px 0 0;padding:24px 22px 44px;border:1px solid #2a4a2a;max-height:85vh;overflow-y:auto;animation:su .2s ease}
/* Body weight modal */
#bw-modal{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:150;display:flex;flex-direction:column;justify-content:flex-end}
#bw-inner{background:#0a1a0a;border-radius:22px 22px 0 0;padding:24px 20px 44px;border:1px solid #1a3a1a;max-height:75vh;overflow-y:auto;animation:su .2s ease}
/* Chat */
#chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 64px);padding-top:18px}
#chat-msgs{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.msg-user{align-self:flex-end;max-width:86%;background:#7fff47;color:#060e06;padding:13px 16px;border-radius:18px 18px 4px 18px;font-size:15px;line-height:1.75}
.msg-ai{align-self:flex-start;max-width:86%;background:#0d1a0d;color:#c8e8c8;padding:13px 16px;border-radius:18px 18px 18px 4px;font-size:15px;line-height:1.75;border:1px solid #1a3a1a;white-space:pre-wrap}
#chat-input-row{padding:12px 14px;border-top:1px solid #1a2a1a;display:flex;gap:10px;background:#060e06}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ── Constants ──
const POS=["Attaquant","Milieu offensif","Milieu défensif","Défenseur","Latéral","Gardien"];
const OBJ=["Vitesse & explosivité","Technique balle au pied","Physique & endurance","Finition","Vision du jeu","Domination aérienne","Placement défensif"];
const WEAK=["Pied faible","Dribble","Centres","Jeu de tête","Pressing","Récupération balle","Gestion de l'espace","Confiance en soi"];
const LVLS=["Amateur","Régional","Départemental","National","Semi-pro"];
const GOALS=[{id:"muscle",label:"Prise de muscle",icon:"💪"},{id:"fat_loss",label:"Perte de graisse",icon:"🔥"},{id:"maintain",label:"Maintien",icon:"⚖️"},{id:"recomp",label:"Recomposition",icon:"🔄"}];
const STYPES=[{id:"salle",label:"Salle",icon:"🏋️"},{id:"terrain",label:"Terrain",icon:"⚽"},{id:"course",label:"Course",icon:"🏃"}];
const TABS=[{id:"program",label:"Programme",icon:"🗓"},{id:"nutrition",label:"Nutrition",icon:"🥗"},{id:"mental",label:"Mental",icon:"🧠"},{id:"recup",label:"Récup",icon:"😴"},{id:"coach",label:"Coach",icon:"⚡"}];
const NUTRI_T=[["avant","Avant"],["pendant","Pendant"],["après","Récup"],["quotidien","Jour type"],["compétition","Match"]];
const MENTAL_T=[["routine","Routine"],["confiance","Confiance"],["pression","Pression"],["visualisation","Visualisation"],["resilience","Résilience"],["sommeil","Sommeil"]];

// ── State ──
let S={
  apiKey:localStorage.getItem("fc_key")||"",
  profile:null,
  log:[],
  weightLog:{},
  bodyWeights:[],
  tab:"program",
  onboardStep:0,
  onboardForm:{name:"",age:"",position:"",level:"",objectives:[],weaknesses:[],deadline:"",sessionsPerWeek:"3",height:"",currentWeight:"",targetWeight:"",bodyGoal:"muscle"},
  generating:false,
  pendingSession:null,
  error:"",
  stype:"terrain",
  runner:null,
  nutri_t:"avant",
  nutri_result:null,
  nutri_loading:false,
  mental_t:"routine",
  mental_result:null,
  mental_loading:false,
  chat:[],
  chat_loading:false,
  info_ex:null,
  show_bw:false,
  sessionTime:"matin",
  sleepLog:[],
  siestaLog:[],
  recup_result:null,
  recup_loading:false,
  timer:{active:false,remaining:0,label:"",isLast:false,exIdx:0,setIdx:0},
};

// ── Load saved data ──
try{S.profile=JSON.parse(localStorage.getItem("fc_profile"));}catch(e){}
try{S.log=JSON.parse(localStorage.getItem("fc_sessions"))||[];}catch(e){}
try{S.weightLog=JSON.parse(localStorage.getItem("fc_weights"))||{};}catch(e){}
try{S.bodyWeights=JSON.parse(localStorage.getItem("fc_bw"))||[];}catch(e){}
try{S.sleepLog=JSON.parse(localStorage.getItem("fc_sleep"))||[];}catch(e){}
try{S.siestaLog=JSON.parse(localStorage.getItem("fc_siesta"))||[];}catch(e){}

// ── Utils ──
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
const fmtDate=()=>new Date().toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"});
const getWk=()=>{const n=new Date(),j=new Date(n.getFullYear(),0,1),w=Math.ceil(((n-j)/86400000+j.getDay()+1)/7);return`${n.getFullYear()}-W${w}`;};
const parseWks=d=>{if(!d)return null;const m=d.match(/(\d+)\s*(semaine|sem|week)/i);return m?parseInt(m[1]):null;};

function beep(f=880,d=.4){
  try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();
  o.connect(g);g.connect(c.destination);o.frequency.value=f;
  g.gain.setValueAtTime(.4,c.currentTime);g.gain.exponentialRampToValueAtTime(.01,c.currentTime+d);
  o.start(c.currentTime);o.stop(c.currentTime+d);}catch(e){}
}

// BMR/TDEE
const calcBMR=(w,h,a)=>Math.round(10*w+6.25*h-5*a+5);
const calcTDEE=(b)=>Math.round(b*1.75);
const calcTarget=(t,g)=>g==="muscle"?t+350:g==="fat_loss"?t-400:g==="recomp"?t+50:t;
const calcProt=(w,g)=>Math.round(w*(g==="fat_loss"?2.4:g==="muscle"?2.2:2.0));

// ── JSON extraction ──
function extractJSON(txt){
  if(!txt)return null;
  const clean=txt.replace(/```json/gi,"").replace(/```/g,"").trim();
  const s=clean.indexOf("{"),e=clean.lastIndexOf("}");
  if(s===-1||e<=s)return null;
  const str=clean.slice(s,e+1);
  try{const j=JSON.parse(str);if(j&&Array.isArray(j.exercices)&&j.exercices.length>0)return j;}catch(e1){}
  try{const j=JSON.parse(str.replace(/,\s*([}\]])/g,"$1"));if(j&&Array.isArray(j.exercices))return j;}catch(e2){}
  return null;
}

// ── API ──
const SYS=()=>{
  const p=S.profile;
  const bmi=p.height&&p.currentWeight?`\nCorps: ${p.height}cm, ${p.currentWeight}kg → ${p.targetWeight||"?"}kg (${GOALS.find(g=>g.id===p.bodyGoal)?.label||"maintien"}) | TDEE: ${calcTDEE(calcBMR(+p.currentWeight,+p.height,+p.age))} kcal | Cible: ${calcTarget(calcTDEE(calcBMR(+p.currentWeight,+p.height,+p.age)),p.bodyGoal)} kcal/j`:"";
  return`Tu es un coach football UEFA d'élite. Bases scientifiques : NSCA, ACSM, Journal of Sports Sciences. Académies : Bayern Munich, Manchester City, PSG, Chelsea, BVB, Ajax. Cite toujours la source.
Joueur : ${p.name}, ${p.age}ans | ${p.position} | ${p.level}
Objectifs : ${p.objectives?.join(", ")} | Points faibles : ${p.weaknesses?.join(", ")}
Échéance : ${p.deadline||"non précisée"} | ${p.sessionsPerWeek||3} séances/sem${bmi}
Règles : Direct, actionnable, sections claires, français, mobile.`;
};

const PPROMPT=(t)=>{
  const p=S.profile;
  const type=t==="salle"?"musculation en salle":t==="terrain"?"technique/tactique avec ballon":"course et sprints";
  return`Génère une séance de ${type} pour ${p.position} (${p.level}). Objectifs: ${p.objectives?.join(", ")}. Points faibles: ${p.weaknesses?.join(", ")}. Méthodes académies d'élite + recherche scientifique.
RÈGLES ABSOLUES:
1. NE JAMAIS utiliser des balises code. Ta réponse commence DIRECTEMENT par { et se termine par }. Rien d'autre.
2. youtube_query = juste le nom de l'exercice (ex: back squat, fente avant, gainage).
{"titre":"...","objectif":"...","duree":"45 min","echauffement":"...","exercices":[{"nom":"...","series":4,"repetitions":"8-10","repos_serie":90,"repos_exercice":180,"groupes":"...","description":"Exécution détaillée 3-5 phrases.","science":"Référence académie ou étude.","youtube_query":"nom exact de l'exercice uniquement ex: back squat"}],"retour_au_calme":"..."}`;
};

async function callAPI(msgs,sys){
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),30000); // 30s timeout
  let r,d;
  try{
    r=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      signal:controller.signal,
      headers:{
        "Content-Type":"application/json",
        "x-api-key":S.apiKey,
        "anthropic-version":"2023-06-01",
        "anthropic-dangerous-direct-browser-access":"true"
      },
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:2500,system:sys||SYS(),messages:msgs})
    });
    clearTimeout(timeout);
    d=await r.json();
  }catch(e){
    clearTimeout(timeout);
    if(e.name==="AbortError")throw new Error("⏱ Timeout — connexion trop lente, réessaie");
    if(e.message.includes("Failed to fetch")||e.message.includes("NetworkError")||e.message.includes("fetch")){
      throw new Error("📡 Erreur réseau — vérifie ta connexion internet et réessaie");
    }
    throw new Error("❌ "+e.message);
  }
  if(!r.ok&&!d){throw new Error("❌ Serveur inaccessible (HTTP "+r.status+")");}
  if(d.error){
    const m=JSON.stringify(d.error);
    if(m.includes("exceeded_limit")||m.includes("credit"))throw new Error("💳 Crédit épuisé → console.anthropic.com → Billing");
    if(m.includes("rate_limit")||m.includes("overloaded"))throw new Error("⏳ Limite dépassée — attends 2-3 min et réessaie");
    if(m.includes("auth")||m.includes("invalid"))throw new Error("🔑 Clé API invalide — vérifie ta clé");
    if(m.includes("not_found")||m.includes("model"))throw new Error("❌ Modèle introuvable — contacte le support");
    throw new Error("Erreur API: "+m.substring(0,150));
  }
  return d.content?.[0]?.text||"";
}

// ── Timer management ──
let timerInterval=null;
function startTimer(duration,label,isLast,exIdx,setIdx){
  clearInterval(timerInterval);
  S.timer={active:true,remaining:duration,label,isLast,exIdx,setIdx};
  updateTimerUI();
  timerInterval=setInterval(()=>{
    S.timer.remaining--;
    if(S.timer.remaining<=3&&S.timer.remaining>0)beep(440,.12);
    if(S.timer.remaining<=0){
      clearInterval(timerInterval);
      beep(880,.8);
      S.timer.active=false;
      if(isLast){
        // Move to next exercise
        if(S.runner){
          S.runner.exIdx++;
          S.runner.doneSets=[];
          S.runner.weights=[];
        }
      }
      renderRunner();
      return;
    }
    updateTimerUI();
  },1000);
}
function stopTimer(){clearInterval(timerInterval);S.timer.active=false;}

function updateTimerUI(){
  const box=document.getElementById("timer-box");
  const num=document.getElementById("timer-num");
  const bar=document.getElementById("timer-bar");
  if(!box||!num)return;
  const {remaining,label,active}=S.timer;
  if(!active){box.style.display="none";return;}
  box.style.display="block";
  const urgent=remaining<=10;
  box.style.background=urgent?"#160606":"#061806";
  box.style.border=`2px solid ${urgent?"#ff6b3d":"#2a5a2a"}`;
  const min=Math.floor(remaining/60),sec=remaining%60;
  num.textContent=min>0?`${min}:${sec.toString().padStart(2,"0")}`:remaining;
  num.style.color=urgent?"#ff6b3d":"#7fff47";
  const dur=S.timer.isLast?(S.runner?.session?.exercices?.[S.runner.exIdx-1]?.repos_exercice||180):(S.runner?.session?.exercices?.[S.runner.exIdx]?.repos_serie||90);
  const pct=Math.max(0,((dur-remaining)/dur)*100);
  if(bar){bar.style.width=pct+"%";bar.style.background=urgent?"#ff6b3d":"linear-gradient(90deg,#7fff47,#ffd700)";}
  const lbl=document.getElementById("timer-label");
  if(lbl)lbl.textContent=label;
}

// ── Render helpers ──
function pillsHTML(items,selected,prefix,multi=false){
  if(Array.isArray(selected)){
    return items.map(v=>`<button class="pill ${selected.includes(v)?"active":""}" data-action="${prefix}" data-val="${v}">${v}</button>`).join("");
  }
  return items.map(v=>`<button class="pill ${selected===v?"active":""}" data-action="${prefix}" data-val="${v}">${v}</button>`).join("");
}

// ── Progress block ──
function progressHTML(){
  const p=S.profile,log=S.log;
  const wk=getWk(),wt=parseInt(p.sessionsPerWeek||3);
  const wd=log.filter(s=>s.week===wk&&s.done).length;
  const wp=Math.min(100,Math.round((wd/wt)*100));
  const wc=wp>=100?"#7fff47":wp>=50?"#ffd700":"#ff6b3d";
  const tw=parseWks(p.deadline),tt=tw?tw*wt:null;
  const td=log.filter(s=>s.done).length;
  const tp=tt?Math.min(100,Math.round((td/tt)*100)):null;
  return`<div class="card" style="margin-bottom:18px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <span class="label" style="margin:0">Cette semaine</span>
      <span style="color:${wc};font-size:22px;font-weight:900">${wd}<span style="color:#3a5a3a;font-size:14px;font-weight:400">/${wt}</span></span>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${wp}%;background:${wc}"></div></div>
    <div style="display:flex;justify-content:space-between">
      <span style="color:${wc};font-size:13px;font-weight:700">${wp}% accompli</span>
      <span style="color:#3a5a3a;font-size:13px">${wt-wd>0?`${wt-wd} séance${wt-wd>1?"s":""} restante${wt-wd>1?"s":""}`:"✅ Semaine complète !"}</span>
    </div>
    ${tp!==null?`<div style="border-top:1px solid #1a2a1a;margin-top:14px;padding-top:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span class="label" style="margin:0">Objectif global</span>
        <span style="color:#7fff47;font-size:22px;font-weight:900">${td}<span style="color:#3a5a3a;font-size:14px;font-weight:400">/${tt}</span></span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${tp}%;background:linear-gradient(90deg,#7fff47,#ffd700)"></div></div>
      <div style="display:flex;justify-content:space-between">
        <span style="color:#7fff47;font-size:13px;font-weight:700">${tp}% de l'objectif</span>
        <span style="color:#3a5a3a;font-size:13px">${tt-td} séances restantes</span>
      </div>
    </div>`:""}
  </div>`;
}

// ── Main render ──
function render(){
  const app=document.getElementById("app");
  if(!S.apiKey||!S.apiKey.startsWith("sk-")){app.innerHTML=renderApiKey();return;}
  if(!S.profile){app.innerHTML=renderOnboarding();return;}
  app.innerHTML=`
    <div id="main-header">
      <div>
        <div style="color:#7fff47;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase">Football Coach IA</div>
        <div style="color:#e8f5e8;font-size:17px;font-weight:800">${S.profile.name} · ${S.profile.position}</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <button data-action="show-bw" style="background:#0d1a0d;border:1px solid #1a3a1a;color:#7a9a7a;font-size:15px;padding:7px 12px;border-radius:10px">⚖️</button>
        <div style="text-align:right">
          <div style="color:#7fff47;font-size:22px;font-weight:900;line-height:1">${S.log.filter(s=>s.done).length}</div>
          <div style="color:#3a5a3a;font-size:10px">séances ✓</div>
        </div>
        <button data-action="reset" style="background:none;border:1px solid #1a3a1a;color:#3a5a3a;font-size:11px;padding:6px 8px;border-radius:8px">Reset</button>
      </div>
    </div>
    <div style="max-width:480px;margin:0 auto;padding-bottom:80px">
      ${S.tab==="program"?renderProgram():S.tab==="nutrition"?renderNutrition():S.tab==="mental"?renderMental():S.tab==="recup"?renderRecup():renderCoach()}
    </div>
    <div id="bottom-nav">
      ${TABS.map(t=>`<button class="nav-btn" data-action="tab" data-val="${t.id}">
        <span class="nav-icon">${t.icon}</span>
        <span class="nav-label ${S.tab===t.id?"active":""}">${t.label}</span>
        ${S.tab===t.id?`<span class="nav-dot"></span>`:""}
      </button>`).join("")}
    </div>
    ${S.runner?renderRunnerHTML():""}
    ${S.info_ex?renderInfoModal():""}
    ${S.show_bw?renderBWModal():""}
  `;
  if(S.runner&&S.timer.active)updateTimerUI();
  scrollChat();
}

// ── API Key screen ──
function renderApiKey(){
  return`<div class="screen" style="display:flex;flex-direction:column;justify-content:center;min-height:100vh">
    <div style="text-align:center;margin-bottom:36px">
      <div style="font-size:60px;margin-bottom:16px">⚽</div>
      <h1 style="font-size:28px;font-weight:900;margin-bottom:10px">Football Coach IA</h1>
      <p style="color:#3a6a3a;font-size:15px;line-height:1.7">Science-based · Bayern · Man City<br>PSG · Chelsea · BVB · Ajax</p>
    </div>
    <div class="card" style="margin-bottom:18px">
      <div class="label">🔑 Clé API Anthropic</div>
      <input id="api-input" type="password" placeholder="sk-ant-..." style="margin-bottom:12px">
      <p style="color:#3a5a3a;font-size:13px;line-height:1.6">Obtiens ta clé sur <strong style="color:#5a8a5a">console.anthropic.com</strong> → API Keys<br>~0,003€/message · Stockée sur cet appareil</p>
    </div>
    <button data-action="save-key" class="btn-main">Démarrer →</button>
  </div>`;
}

// ── Onboarding ──
function renderOnboarding(){
  const f=S.onboardForm,step=S.onboardStep;
  const steps=[
    {title:"Qui es-tu ?",sub:"Profil de base",valid:f.name&&f.age,content:`
      <input id="ob-name" placeholder="Ton prénom" value="${f.name}" data-ob="name" style="margin-bottom:12px">
      <input id="ob-age" type="number" placeholder="Ton âge" value="${f.age}" data-ob="age" style="margin-bottom:12px">
      <input id="ob-deadline" placeholder="Échéance (ex: essai dans 6 semaines)" value="${f.deadline}" data-ob="deadline" style="margin-bottom:16px">
      <div><span class="label">Séances/semaine (jusqu'à 2x/jour)</span><div style="display:flex;gap:8px;flex-wrap:wrap">${["2","3","4","5","6","7","8","9","10","12","14"].map(n=>`<button class="pill ${f.sessionsPerWeek===n?"active":""}" data-action="ob-setsw" data-val="${n}">${n}</button>`).join("")}</div></div>`},
    {title:"Ton corps",sub:"Composition corporelle",valid:true,content:`
      <input id="ob-height" type="number" placeholder="Taille (cm)" value="${f.height}" data-ob="height" style="margin-bottom:12px">
      <input id="ob-cw" type="number" step="0.5" placeholder="Poids actuel (kg)" value="${f.currentWeight}" data-ob="currentWeight" style="margin-bottom:12px">
      <input id="ob-tw" type="number" step="0.5" placeholder="Poids visé (kg)" value="${f.targetWeight}" data-ob="targetWeight" style="margin-bottom:16px">
      <span class="label">Objectif physique</span>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">
        ${GOALS.map(g=>`<button class="pill ${f.bodyGoal===g.id?"active":""}" data-action="ob-goal" data-val="${g.id}" style="padding:14px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:5px">
          <span style="font-size:22px">${g.icon}</span><span style="font-size:13px;font-weight:700">${g.label}</span>
        </button>`).join("")}
      </div>
      ${f.height&&f.currentWeight?`<div style="background:#061206;border:1px solid #2a5a2a;border-radius:12px;padding:12px 16px">
        <div style="color:#5a9a5a;font-size:13px">BMR : <strong style="color:#7fff47">${calcBMR(+f.currentWeight,+f.height,+f.age||18)} kcal</strong> · TDEE : <strong style="color:#7fff47">${calcTDEE(calcBMR(+f.currentWeight,+f.height,+f.age||18))} kcal</strong></div>
        <div style="color:#5a9a5a;font-size:13px;margin-top:4px">Cible : <strong style="color:#ffd700">${calcTarget(calcTDEE(calcBMR(+f.currentWeight,+f.height,+f.age||18)),f.bodyGoal)} kcal/j</strong></div>
      </div>`:""}`},
    {title:"Ton poste",sub:"Où tu joues ?",valid:f.position,content:`<div style="display:flex;flex-wrap:wrap;gap:10px">${pillsHTML(POS,f.position,"ob-pos")}</div>`},
    {title:"Ton niveau",sub:"Niveau actuel",valid:f.level,content:`<div style="display:flex;flex-wrap:wrap;gap:10px">${pillsHTML(LVLS,f.level,"ob-lvl")}</div>`},
    {title:"Objectifs",sub:"1 à 3 priorités",valid:f.objectives.length>0,content:`<div style="display:flex;flex-wrap:wrap;gap:10px">${pillsHTML(OBJ,f.objectives,"ob-obj",true)}</div>`},
    {title:"Points faibles",sub:"Ce que tu veux corriger",valid:f.weaknesses.length>0,content:`<div style="display:flex;flex-wrap:wrap;gap:10px">${pillsHTML(WEAK,f.weaknesses,"ob-weak",true)}</div>`},
  ];
  const c=steps[step];
  return`<div class="screen">
    <div style="padding-top:52px;margin-bottom:32px">
      <div style="display:flex;gap:6px;margin-bottom:26px">${steps.map((_,i)=>`<div style="height:4px;flex:1;border-radius:2px;background:${i<=step?"#7fff47":"#1a2a1a"};transition:background .3s"></div>`).join("")}</div>
      <div style="color:#3a5a3a;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px">${c.sub}</div>
      <h1 style="font-size:26px;font-weight:900;line-height:1.2">${c.title}</h1>
    </div>
    <div style="margin-bottom:32px">${c.content}</div>
    <button data-action="ob-next" class="btn-main" ${c.valid?"":"disabled style='background:#1a2a1a;color:#3a5a3a;cursor:not-allowed'"}>
      ${step<steps.length-1?"Suivant →":"Créer mon programme ⚡"}
    </button>
    ${step>0?`<button data-action="ob-back" style="width:100%;margin-top:10px;padding:13px;background:none;border:none;color:#3a5a3a;font-size:15px">← Retour</button>`:""}
  </div>`;
}

  return`<div style="margin-bottom:20px;animation:su .2s ease">
    <div style="background:#061206;border:2px solid #2a5a2a;border-radius:16px;padding:18px;margin-bottom:12px">
      <h3 style="color:#7fff47;font-size:20px;font-weight:900;margin-bottom:8px">${s.titre}</h3>
      <p style="color:#5a9a5a;font-size:15px;margin-bottom:6px">🎯 ${s.objectif}</p>
      <p style="color:#3a6a3a;font-size:13px">${s.sessionTime==="matin"?"🌅 Matin":s.sessionTime==="aprem"?"🌞 Après-midi":"🌙 Soir"}</p>
      ${s.duree?`<p style="color:#3a6a3a;font-size:13px">⏱ Durée : ${s.duree}</p>`:""}
    </div>
    ${s.exercices?.map((ex,i)=>`<div class="card" style="margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">
      <div>
        <div style="font-size:17px;font-weight:800;margin-bottom:6px">${i+1}. ${ex.nom}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <span style="background:#0a2a0a;border:1px solid #2a5a2a;border-radius:8px;padding:4px 10px;color:#7fff47;font-size:14px;font-weight:700">${ex.series}×${ex.repetitions}</span>
          <span style="color:#4a7a4a;font-size:13px;padding:4px 0">${ex.groupes}</span>
        </div>
      </div>
      <div style="text-align:right;flex-shrink:0;margin-left:10px">
        <div style="color:#7fff47;font-size:15px;font-weight:800">${ex.repos_serie}s</div>
        <div style="color:#3a5a3a;font-size:11px">repos série</div>

    </div>`).join("")}

      <button data-action="start-session" style="flex:2;padding:17px;border-radius:14px;border:none;background:#7fff47;color:#060e06;font-size:17px;font-weight:900">▶ Démarrer</button>
      <button data-action="save-session" style="flex:1;padding:17px;border-radius:14px;border:1px solid #2a5a2a;background:none;color:#5a9a5a;font-size:14px;font-weight:700">💾 Sauver</button>

function renderSessionLog(){
  return`<div>
    <span class="label">Mes séances (${S.log.filter(s=>s.done).length}/${S.log.length})</span>
    ${S.log.map((s,i)=>{
      const ti=STYPES.find(t=>t.id===s.type)||STYPES[1];
      return`<div style="background:${s.done?"#0a1f0a":"#0d1a0d"};border:1px solid ${s.done?"#2a5a2a":"#1a3a1a"};border-radius:14px;padding:14px 16px;margin-bottom:10px">
        <div style="display:flex;gap:12px;align-items:center;margin-bottom:${s.exercices?12:0}px">
          <button data-action="toggle-session" data-idx="${i}" style="width:32px;height:32px;min-width:32px;border-radius:50%;border:2px solid ${s.done?"#7fff47":"#2a4a2a"};background:${s.done?"#7fff47":"transparent"};color:${s.done?"#060e06":"transparent"};font-size:15px">${s.done?"✓":""}</button>
          <div style="flex:1">
            <div style="font-size:16px;font-weight:700;color:${s.done?"#7fff47":"#e8f5e8"};text-decoration:${s.done?"line-through":"none"};opacity:${s.done?.7:1}">${ti.icon} ${s.titre||"Séance"}</div>
            <div style="color:#3a6a3a;font-size:13px;margin-top:3px">${ti.label} · ${s.date}${s.exercices?` · ${s.exercices.length} ex.`:""}</div>
          </div>
          <button data-action="del-session" data-idx="${i}" style="background:none;border:none;color:#2a4a2a;font-size:20px">✕</button>
        </div>
        ${s.exercices?`<button data-action="resume-session" data-idx="${i}" style="width:100%;padding:12px;border-radius:12px;border:1px solid #2a5a2a;background:#061206;color:#7fff47;font-size:15px;font-weight:700">▶ Reprendre</button>`:""}
      </div>`;
    }).join("")}
  </div>`;
}

  const exs=r.session.exercices||[];
  if(r.exIdx>=exs.length){
    return`<div id="runner" style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px">
      <div style="font-size:64px;margin-bottom:20px">🏆</div>
      <h2 style="color:#7fff47;font-size:28px;font-weight:900;margin-bottom:12px;text-align:center">Séance terminée !</h2>
      <p style="color:#5a8a5a;font-size:16px;text-align:center;margin-bottom:32px">${exs.length} exercices complétés</p>
      <button data-action="finish-session" style="width:100%;max-width:340px;padding:18px;border-radius:14px;border:none;background:#7fff47;color:#060e06;font-size:17px;font-weight:800;margin-bottom:12px">☑️ Valider la séance</button>
      <button data-action="close-runner" style="width:100%;max-width:340px;padding:15px;border-radius:14px;border:1px solid #2a5a2a;background:none;color:#5a8a5a;font-size:15px">← Retour</button>
    </div>`;
  }
  const ex=exs[r.exIdx];
  const isSalle=r.session.type==="salle";
  const done=r.doneSets||[];
  const wts=r.weights||[];
  const hist=(S.weightLog[ex.nom]||[]).slice(-3).reverse();
  return`<div id="runner">
    <div id="runner-header">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <button data-action="close-runner" style="background:none;border:none;color:#3a5a3a;font-size:24px">←</button>
        <div style="text-align:center">
          <div style="color:#7fff47;font-size:12px;font-weight:700;letter-spacing:1px">${r.session.titre}</div>
          <div style="color:#3a5a3a;font-size:12px">Exercice ${r.exIdx+1} / ${exs.length}</div>
        </div>
        <div style="color:#7fff47;font-size:15px;font-weight:800">${Math.round((r.exIdx/exs.length)*100)}%</div>
      </div>
      <div class="progress-bar" style="height:4px"><div class="progress-fill" style="width:${(r.exIdx/exs.length)*100}%;background:#7fff47"></div></div>
    </div>
    <div style="padding:20px 18px 130px;max-width:480px;margin:0 auto">
      <div style="margin-bottom:20px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
          <div style="flex:1;margin-right:12px">
            <h2 style="font-size:24px;font-weight:900;line-height:1.3;margin-bottom:10px">${ex.nom}</h2>
            <div style="display:flex;gap:8px;flex-wrap:wrap">
              <span style="background:#0a2a0a;border:1px solid #2a5a2a;border-radius:8px;padding:6px 12px;color:#7fff47;font-size:15px;font-weight:700">${ex.series} × ${ex.repetitions}</span>
              <span style="background:#0d1a0d;border:1px solid #1a3a1a;border-radius:8px;padding:6px 12px;color:#6a9a6a;font-size:14px">${ex.groupes}</span>
            </div>
          </div>
          <button data-action="show-info" data-idx="${r.exIdx}" style="background:#0a2a0a;border:2px solid #2a5a2a;color:#7fff47;width:44px;height:44px;border-radius:50%;font-size:20px;flex-shrink:0">ℹ</button>
        </div>
        <div style="display:flex;gap:10px">
          <div style="flex:1;background:#061206;border:1px solid #1a3a1a;border-radius:10px;padding:8px 14px;text-align:center">
            <div style="color:#3a6a3a;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:2px">Repos série</div>
            <div style="color:#7fff47;font-size:20px;font-weight:900">${ex.repos_serie}<span style="font-size:13px;color:#5a8a5a">s</span></div>
          </div>
          <div style="flex:1;background:#061206;border:1px solid #1a3a1a;border-radius:10px;padding:8px 14px;text-align:center">
            <div style="color:#3a6a3a;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:2px">Repos exercice</div>
            <div style="color:#ffd700;font-size:20px;font-weight:900">${ex.repos_exercice}<span style="font-size:13px;color:#9a8a3a">s</span></div>
          </div>
        </div>
      </div>
      <span class="label">Cocher chaque série terminée</span>
      ${Array(ex.series).fill(0).map((_,i)=>`
        <div style="display:flex;gap:10px;align-items:center;margin-bottom:10px">
          <button data-action="mark-set" data-set="${i}" style="width:52px;height:52px;min-width:52px;border-radius:14px;border:2px solid ${done.includes(i)?"#7fff47":"#2a4a2a"};background:${done.includes(i)?"#7fff47":"#0d1a0d"};color:${done.includes(i)?"#060e06":"#5a8a5a"};font-size:${done.includes(i)?20:16}px;font-weight:800;flex-shrink:0">
            ${done.includes(i)?"✓":`S${i+1}`}
          </button>
          ${isSalle?`<input type="number" step="2.5" data-action="set-weight" data-set="${i}" value="${wts[i]||""}" placeholder="${hist[0]?.sets[i]?`Dernier: ${hist[0].sets[i]}kg`:`Série ${i+1} — kg`}" style="flex:1;background:${done.includes(i)?"#0a1f0a":"#0d1a0d"};border:1px solid ${done.includes(i)?"#2a5a2a":"#1a3a1a"};border-radius:12px;padding:14px 16px;color:#e8f5e8;font-size:16px">`:
          `<div style="flex:1;padding:14px 16px;background:${done.includes(i)?"#0a1f0a":"#0d1a0d"};border:1px solid ${done.includes(i)?"#2a5a2a":"#1a3a1a"};border-radius:12px;color:${done.includes(i)?"#7fff47":"#5a8a5a"};font-size:15px;font-weight:${done.includes(i)?700:400}">
            ${done.includes(i)?"✓ Série complétée":ex.repetitions}
          </div>`}
        </div>`).join("")}
      ${isSalle&&wts.some(w=>w)?`<button data-action="save-weights" style="width:100%;padding:13px;border-radius:12px;border:1px solid #2a5a2a;background:#061206;color:#7fff47;font-size:15px;font-weight:700;margin-bottom:12px">💾 Sauvegarder les charges</button>`:""}
      ${isSalle&&hist.length>0?`<div style="margin-bottom:14px">
        <div style="color:#3a6a3a;font-size:13px;margin-bottom:6px">Historique charges :</div>
        ${hist.map(h=>`<div style="background:#061206;border:1px solid #1a3a1a;border-radius:10px;padding:10px 14px;margin-bottom:6px;display:flex;justify-content:space-between">
          <span style="color:#3a6a3a;font-size:13px">${h.date}</span>
          <span style="color:#7a9a7a;font-size:14px;font-weight:600">${h.sets.join(" · ")} kg</span>
        </div>`).join("")}
      </div>`:""}
      <div id="timer-box" style="display:none;border-radius:16px;padding:18px 20px;margin-top:14px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <span id="timer-label" style="font-size:14px;font-weight:700;color:#5a9a5a"></span>
          <button data-action="skip-timer" style="background:none;border:1px solid #2a4a2a;color:#5a8a5a;font-size:13px;padding:5px 14px;border-radius:8px">Passer ›</button>
        </div>
        <div style="text-align:center;margin-bottom:10px">
          <span id="timer-num" style="font-size:56px;font-weight:900;line-height:1;color:#7fff47"></span>
          <span style="color:#5a8a5a;font-size:20px"> s</span>
        </div>
        <div class="progress-bar" style="height:9px"><div id="timer-bar" class="progress-fill" style="width:0%;background:linear-gradient(90deg,#7fff47,#ffd700)"></div></div>
      </div>
      ${done.length>=ex.series&&!S.timer.active?`<button data-action="next-exercise" style="width:100%;padding:18px;border-radius:14px;border:none;background:#7fff47;color:#060e06;font-size:18px;font-weight:900;margin-top:16px">✓ Exercice validé → Suivant</button>`:""}
      ${ex.science?`<div style="background:#061206;border:1px solid #1a3a1a;border-radius:14px;padding:14px 16px;margin-top:18px">
        <div class="label">📚 Référence scientifique</div>
        <p style="color:#5a8a5a;font-size:14px;line-height:1.75">${ex.science}</p>
      </div>`:""}
    </div>
    <div style="position:fixed;bottom:0;left:0;right:0;background:#060e06;border-top:1px solid #1a2a1a;padding:12px 18px 28px;display:flex;gap:10px;max-width:480px;margin:0 auto">
      <button data-action="prev-exercise" ${r.exIdx===0?"disabled style='color:#2a4a2a'":""} style="flex:1;padding:15px;border-radius:14px;border:1px solid #1a3a1a;background:none;color:#5a8a5a;font-size:15px;font-weight:700">← Préc.</button>
      <button data-action="next-exercise" style="flex:2;padding:15px;border-radius:14px;border:none;background:#7fff47;color:#060e06;font-size:17px;font-weight:900">
        ${r.exIdx===exs.length-1?"✓ Terminer →":"Suivant →"}
      </button>
    </div>
  </div>`;
}

// ── Recovery tab ──
function calcRecovScore(){
  const last=S.sleepLog.slice(-1)[0];
  if(!last)return null;
  let score=0;
  // Sleep hours (max 40pts): ideal 8-9h
  const h=last.hours;
  score+=h>=8&&h<=9?40:h>=7&&h<8?30:h>=6&&h<7?18:10;
  // Quality (max 30pts)
  score+=Math.round((last.quality/5)*30);
  // HRV (max 30pts): higher = better recovery
  if(last.hrv){score+=last.hrv>=60?30:last.hrv>=40?20:last.hrv>=25?12:6;}
  else if(last.hr){score+=last.hr<=50?30:last.hr<=58?22:last.hr<=65?14:8;}
  else score+=15; // neutral if no HR data
  return Math.min(100,score);
}

// ── Event handling ──
document.getElementById("app").addEventListener("click",async e=>{
  const btn=e.target.closest("[data-action]");
  if(!btn)return;
  const action=btn.dataset.action;
  const val=btn.dataset.val;

  if(action==="save-key"){
    const k=document.getElementById("api-input")?.value?.trim();
    if(k?.startsWith("sk-")){S.apiKey=k;localStorage.setItem("fc_key",k);render();}
    else alert("Clé invalide — commence par sk-");
    return;
  }

  if(action==="ob-next"){
    // Read current step inputs
    const step=S.onboardStep;
    const f=S.onboardForm;
    if(step===0){
      f.name=document.getElementById("ob-name")?.value||f.name;
      f.age=document.getElementById("ob-age")?.value||f.age;
      f.deadline=document.getElementById("ob-deadline")?.value||f.deadline;
    }
    if(step===1){
      f.height=document.getElementById("ob-height")?.value||f.height;
      f.currentWeight=document.getElementById("ob-cw")?.value||f.currentWeight;
      f.targetWeight=document.getElementById("ob-tw")?.value||f.targetWeight;
    }
    if(step<5){S.onboardStep++;render();}
    else{
      S.profile={...f};S.onboardStep=0;
      save("fc_profile",S.profile);
      S.chat=[{role:"assistant",content:`Prêt ${S.profile.name} 🔥 Pose ta question.`}];
      render();
    }
    return;
  }
  if(action==="ob-back"){S.onboardStep=Math.max(0,S.onboardStep-1);render();return;}

  // Pill selections in onboarding
  if(action==="ob-setsw"){S.onboardForm.sessionsPerWeek=val;render();return;}
  if(action==="ob-goal"){S.onboardForm.bodyGoal=val;render();return;}
  if(action==="ob-pos"){S.onboardForm.position=val;render();return;}
  if(action==="ob-lvl"){S.onboardForm.level=val;render();return;}
  if(action==="ob-obj"){
    const arr=S.onboardForm.objectives;
    S.onboardForm.objectives=arr.includes(val)?arr.filter(x=>x!==val):[...arr,val];
    render();return;
  }
  if(action==="ob-weak"){
    const arr=S.onboardForm.weaknesses;
    S.onboardForm.weaknesses=arr.includes(val)?arr.filter(x=>x!==val):[...arr,val];
    render();return;
  }

  if(action==="tab"){S.tab=val;render();return;}
  if(action==="stype"){S.stype=val;render();return;}
  if(action==="session-time"){S.sessionTime=val;render();return;}
  if(action==="reset"){if(confirm("Réinitialiser tout ?")){localStorage.clear();S.profile=null;S.log=[];S.apiKey="";render();}return;}
  if(action==="show-bw"){S.show_bw=true;render();return;}
  if(action==="close-bw"){S.show_bw=false;render();return;}
  if(action==="add-bw"){
    const v=document.getElementById("bw-input")?.value;
    if(!v)return;
    S.bodyWeights=[...S.bodyWeights,{date:fmtDate(),w:parseFloat(v)}].slice(-30);
    save("fc_bw",S.bodyWeights);render();return;
  }

  if(action==="generate"){
    S.generating=true;S.error="";S.pendingSession=null;render();
    let j=null, lastErr="";
    for(let attempt=0;attempt<3;attempt++){
      try{
        if(attempt>0){
          // Update UI to show retry
          document.querySelector("[data-action='generate']").innerHTML=`⏳ Tentative ${attempt+1}/3…`;
        }
        const txt=await callAPI([{role:"user",content:PPROMPT(S.stype)}]);
        j=extractJSON(txt);
        if(j)break;
        lastErr="Format incorrect (tentative "+(attempt+1)+"/3)";
      }catch(er){
        lastErr=er.message;
        // Only retry on network errors, not API errors
        if(!er.message.includes("réseau")&&!er.message.includes("Timeout"))break;
      }
    }
    if(j){S.pendingSession={...j,type:S.stype,sessionTime:S.sessionTime};}
    else{S.error=lastErr||"Génération échouée après 3 tentatives — réessaie.";}
    S.generating=false;render();return;
  }

  if(action==="start-session"){
    const sess=S.pendingSession;
    // Save to log immediately (done:false) so it's preserved if user goes back
    const existing=S.log.findIndex(l=>l.id===sess.id);
    if(existing<0){
      const entry={id:Date.now(),...sess,date:fmtDate(),week:getWk(),done:false};
      S.log=[entry,...S.log];save("fc_sessions",S.log);
      S.runner={session:entry,exIdx:0,doneSets:[],weights:[]};
    } else {
      S.runner={session:S.log[existing],exIdx:0,doneSets:[],weights:[]};
    }
    S.pendingSession=null;render();return;
  }
  if(action==="save-session"){
    if(!S.pendingSession)return;
    const entry={id:Date.now(),...S.pendingSession,date:fmtDate(),week:getWk(),done:false};
    S.log=[entry,...S.log];save("fc_sessions",S.log);S.pendingSession=null;render();return;
  }
  if(action==="resume-session"){
    const s=S.log[parseInt(btn.dataset.idx)];
    S.runner={session:s,exIdx:0,doneSets:[],weights:[]};render();return;
  }
  if(action==="toggle-session"){
    const i=parseInt(btn.dataset.idx);
    S.log=S.log.map((s,idx)=>idx===i?{...s,done:!s.done}:s);
    save("fc_sessions",S.log);render();return;
  }
  if(action==="del-session"){
    if(!confirm("Supprimer ?"))return;
    S.log=S.log.filter((_,idx)=>idx!==parseInt(btn.dataset.idx));
    save("fc_sessions",S.log);render();return;
  }

  if(action==="mark-set"){
    const i=parseInt(btn.dataset.set);
    if(!S.runner||S.runner.doneSets.includes(i))return;
    S.runner.doneSets=[...S.runner.doneSets,i];
    beep(440,.12);
    const isLast=S.runner.doneSets.length>=S.runner.session.exercices[S.runner.exIdx].series;
    const ex=S.runner.session.exercices[S.runner.exIdx];
    const dur=isLast?ex.repos_exercice:ex.repos_serie;
    const lbl=isLast?`⏸ Pause inter-exercice — ${ex.repos_exercice}s`:`⏱ Récup entre séries — ${ex.repos_serie}s`;
    renderRunnerInPlace();
    startTimer(dur,lbl,isLast,S.runner.exIdx,i);
    return;
  }
  if(action==="set-weight"){
    // handled by input event
    return;
  }
  if(action==="save-weights"){
    const r=S.runner;
    if(!r)return;
    const ex=r.session.exercices[r.exIdx];
    const wts=r.weights.filter(w=>w);
    if(!wts.length)return;
    const entry={date:fmtDate(),sets:wts};
    S.weightLog={...S.weightLog,[ex.nom]:[...(S.weightLog[ex.nom]||[]),entry].slice(-15)};
    save("fc_weights",S.weightLog);
    alert("Charges sauvegardées ✓");return;
  }
  if(action==="next-exercise"){
    stopTimer();
    if(S.runner){S.runner.exIdx++;S.runner.doneSets=[];S.runner.weights=[];}
    render();return;
  }
  if(action==="prev-exercise"){
    stopTimer();
    if(S.runner&&S.runner.exIdx>0){S.runner.exIdx--;S.runner.doneSets=[];S.runner.weights=[];}
    render();return;
  }
  if(action==="skip-timer"){
    stopTimer();
    if(S.timer.isLast&&S.runner){S.runner.exIdx++;S.runner.doneSets=[];S.runner.weights=[];}
    render();return;
  }
  if(action==="close-runner"){stopTimer();S.runner=null;render();return;}
  if(action==="finish-session"){
    stopTimer();
    if(S.runner){
      const s=S.runner.session;
      const existing=S.log.findIndex(l=>l.id===s.id);
      if(existing>=0){S.log[existing].done=true;}
      else{S.log=[{id:Date.now(),...s,date:fmtDate(),week:getWk(),done:true},...S.log];}
      save("fc_sessions",S.log);
    }
    S.runner=null;S.tab="program";render();return;
  }
  if(action==="show-info"){
    const idx=parseInt(btn.dataset.idx);
    S.info_ex=S.runner?.session?.exercices?.[idx];
    render();return;
  }
  if(action==="close-info"){S.info_ex=null;render();return;}

  if(action==="log-sleep"){
    const h=parseFloat(document.getElementById("sl-hours")?.value||0);
    const q=S._sleepQ||3;
    const hr=parseFloat(document.getElementById("sl-hr")?.value||0);
    const hrv=parseFloat(document.getElementById("sl-hrv")?.value||0);
    if(!h)return;
    S.sleepLog=[...S.sleepLog,{date:fmtDate(),hours:h,quality:q,hr:hr||null,hrv:hrv||null}].slice(-30);
    save("fc_sleep",S.sleepLog);render();return;
  }
  if(action==="sleep-q"){S._sleepQ=parseInt(val);render();return;}
  if(action==="log-siesta"){
    const m=parseInt(document.getElementById("si-min")?.value||0);
    if(!m)return;
    S.siestaLog=[...S.siestaLog,{date:fmtDate(),minutes:m}].slice(-30);
    save("fc_siesta",S.siestaLog);render();return;
  }
  if(action==="get-recup"){
    const last3=S.sleepLog.slice(-3);
    const avgH=last3.length?Math.round(last3.reduce((a,s)=>a+s.hours,0)/last3.length*10)/10:null;
    const avgQ=last3.length?Math.round(last3.reduce((a,s)=>a+s.quality,0)/last3.length*10)/10:null;
    const lastHR=S.sleepLog.slice(-1)[0]?.hr;
    const lastHRV=S.sleepLog.slice(-1)[0]?.hrv;
    const siestas=S.siestaLog.slice(-3);
    const prompt=`Analyse ma récupération et donne des conseils personnalisés :
${avgH?`- Sommeil moyen (3 dernières nuits) : ${avgH}h, qualité ${avgQ}/5`:"- Pas encore de données sommeil"}
${lastHR?`- FC repos (Apple Watch) : ${lastHR} bpm`:""}
${lastHRV?`- HRV : ${lastHRV} ms`:""}
${siestas.length?`- Siestes récentes : ${siestas.map(s=>s.minutes+"min").join(", ")}`:"- Pas de sieste récente"}
- Charge d'entraînement : ${S.profile.sessionsPerWeek} séances/semaine
Donne des conseils précis sur le sommeil, la récupération, les siestes stratégiques pour un footballeur en période intense. Cite les protocoles des académies d'élite (Bayern, Man City) et la recherche scientifique.`;
    S.recup_loading=true;S.recup_result=null;render();
    try{S.recup_result=await callAPI([{role:"user",content:prompt}]);}
    catch(er){S.recup_result="Erreur: "+er.message;}
    S.recup_loading=false;render();return;
  }
  if(action==="nutri-t"){S.nutri_t=val;render();return;}
  if(action==="get-nutri"){
    const p=S.profile;
    const hasBMI=p.height&&p.currentWeight;
    const tdee=hasBMI?calcTDEE(calcBMR(+p.currentWeight,+p.height,+p.age)):null;
    const target=tdee?calcTarget(tdee,p.bodyGoal):null;
    const prot=hasBMI?calcProt(+p.currentWeight,p.bodyGoal):null;
    const gInfo=GOALS.find(g=>g.id===p.bodyGoal);
    const P={
      avant:`Plan nutritionnel AVANT l'entraînement/match. Timings précis, quantités, à éviter. Cite académies d'élite et recherche scientifique.${hasBMI?` Cible : ${target} kcal/j, ${prot}g protéines/j.`:""}`,
      pendant:`Nutrition PENDANT l'effort. Hydratation, collations. Cite recherche scientifique.`,
      après:`Récupération APRÈS l'effort. Fenêtre anabolique, repas, supplémentation.${hasBMI?` Cible protéines : ${prot}g/j.`:""}`,
      quotidien:`Plan alimentaire complet journée d'entraînement.${hasBMI?` CIBLE EXACTE : ${target} kcal/j, ${prot}g protéines/j pour ${gInfo?.label}. Donne macros précis par repas.`:""}`,
      compétition:`Protocole nutritionnel 3 jours pour la compétition (J-2, J-1, Jour J). Méthodes clubs professionnels.`,
    };
    S.nutri_loading=true;S.nutri_result=null;render();
    try{S.nutri_result=await callAPI([{role:"user",content:P[S.nutri_t]}]);}
    catch(er){S.nutri_result="Erreur: "+er.message;}
    S.nutri_loading=false;render();return;
  }

  if(action==="mental-t"){S.mental_t=val;render();return;}
  if(action==="get-mental"){
    const P={
      routine:"Routine de préparation mentale pré-match complète. Méthodes Man City, Ajax. Base scientifique.",
      confiance:"Techniques concrètes pour booster la confiance. Exercices pratiques. Académies d'élite.",
      pression:"Gérer la pression en match. Techniques actionnables. Science-based.",
      visualisation:"Script visualisation sportive 5 min. Adapté à mon poste. Méthode grands clubs.",
      resilience:"Protocole mental post-échec. Psychologie du sport.",
      sommeil:"Récupération par le sommeil pour footballeur. Méthodes académies."
    };
    S.mental_loading=true;S.mental_result=null;render();
    try{S.mental_result=await callAPI([{role:"user",content:P[S.mental_t]}]);}
    catch(er){S.mental_result="Erreur: "+er.message;}
    S.mental_loading=false;render();return;
  }

  if(action==="send-chat"){
    const inp=document.getElementById("chat-inp");
    const msg=inp?.value?.trim();
    if(!msg||S.chat_loading)return;
    S.chat=[...S.chat,{role:"user",content:msg}];
    S.chat_loading=true;render();
    try{
      const r=await callAPI(S.chat.map(m=>({role:m.role,content:m.content})));
      S.chat=[...S.chat,{role:"assistant",content:r}];
    }catch(er){S.chat=[...S.chat,{role:"assistant",content:"Erreur: "+er.message}];}
    S.chat_loading=false;render();return;
  }
});

// Input events
document.getElementById("app").addEventListener("input",e=>{
  const el=e.target;
  // Onboarding live input
  const ob=el.dataset.ob;
  if(ob)S.onboardForm[ob]=el.value;
  // Weight input in runner
  if(el.dataset.action==="set-weight"&&S.runner){
    const i=parseInt(el.dataset.set);
    if(!S.runner.weights)S.runner.weights=[];
    S.runner.weights[i]=el.value;
  }
  // Chat enter key handled elsewhere
});

document.getElementById("app").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.id==="chat-inp"){
    document.querySelector("[data-action='send-chat']")?.click();
  }
});

// Partial runner re-render (keep timer DOM)
function renderRunnerInPlace(){
  const runner=document.getElementById("runner");
  if(!runner)return;
  const r=S.runner;
  const exs=r.session.exercices||[];
  const ex=exs[r.exIdx];
  const isSalle=r.session.type==="salle";
  const done=r.doneSets||[];
  // Just re-render set buttons
  const setBtns=runner.querySelectorAll("[data-action='mark-set']");
  setBtns.forEach((btn,i)=>{
    const isDone=done.includes(i);
    btn.style.border=`2px solid ${isDone?"#7fff47":"#2a4a2a"}`;
    btn.style.background=isDone?"#7fff47":"#0d1a0d";
    btn.style.color=isDone?"#060e06":"#5a8a5a";
    btn.style.fontSize=isDone?"20px":"16px";
    btn.textContent=isDone?"✓":`S${i+1}`;
  });
}

// ── Init ──
render();
</script>
