<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VISTACOACH</title>

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="VISTACOACH">
<meta name="theme-color" content="#0A0C10">
<link rel="apple-touch-icon" id="pwa-icon" href="">
<link rel="manifest" id="pwa-manifest" href="">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0C10;--card:#131921;--surface:#1a2030;
  --border:#1E2530;--border2:#2a3040;
  --yellow:#EEFF00;--purple:#3E25F5;--purple2:#5B42F5;
  --text:#ffffff;--text2:#8892A0;--text3:#4A5568;
  --red:#f87171;--amber:#f59e0b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:'Inter',sans-serif;color:var(--text);font-size:16px;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
input,button,select,textarea{font-family:'Inter',sans-serif}
input{width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:16px}
input::placeholder{color:var(--text3)}
input:focus{outline:none;border-color:var(--yellow)!important;box-shadow:0 0 0 2px rgba(238,255,0,.1)}
textarea{width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:15px;resize:none;line-height:1.5}
textarea:focus{outline:none;border-color:var(--yellow)!important}
::-webkit-scrollbar{width:0}
.heading{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:1px}
.screen{min-height:100vh;padding:0 20px 40px;max-width:480px;margin:0 auto}
.pill{padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text2);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.pill.active{border-color:var(--purple);background:var(--purple);color:#fff;font-weight:700}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px}
.label{color:var(--yellow);font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;display:block;margin-bottom:10px}
.btn-main{width:100%;padding:16px;border-radius:12px;background:var(--yellow);color:var(--bg);font-size:16px;font-weight:800;font-family:'Barlow Condensed',sans-serif;letter-spacing:2px;text-transform:uppercase;cursor:pointer;border:none;transition:all .15s}
.btn-main:active{transform:scale(.98);background:#d4e000}
.btn-outline{width:100%;padding:16px;border-radius:12px;background:transparent;border:2px solid var(--yellow);color:var(--yellow);font-size:15px;font-weight:700;font-family:'Barlow Condensed',sans-serif;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:all .15s}
.btn-outline:active{background:rgba(238,255,0,.08)}
.btn-ghost{width:100%;padding:13px;border-radius:10px;background:none;border:1px solid var(--border2);color:var(--text2);font-size:14px;font-weight:600;cursor:pointer;transition:all .15s}
.tag{display:inline-block;padding:5px 12px;border-radius:6px;background:var(--purple);color:#fff;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
@keyframes su{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes si{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.su{animation:su .22s ease forwards}
.dots{display:flex;gap:6px;padding:14px 0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--yellow)}
.dot:nth-child(1){animation:pulse 1.2s .0s infinite}
.dot:nth-child(2){animation:pulse 1.2s .2s infinite}
.dot:nth-child(3){animation:pulse 1.2s .4s infinite}
/* Nav */
#bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(10,12,16,.96);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;padding:10px 0 22px;z-index:50}
.nb{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;cursor:pointer}
.ni{font-size:22px}
.nl{font-size:10px;font-weight:700;color:var(--text3);font-family:'Barlow Condensed',sans-serif;letter-spacing:1.5px;text-transform:uppercase}
.nl.on{color:var(--yellow)}
.nd{width:5px;height:5px;border-radius:50%;background:var(--yellow)}
/* Header */
#hdr{position:sticky;top:0;z-index:40;background:rgba(10,12,16,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:13px 18px 11px;display:flex;justify-content:space-between;align-items:center;max-width:480px;margin:0 auto}
/* Progress */
.pbar{height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin:6px 0}
.pfill{height:100%;border-radius:3px;transition:width .5s ease}
/* Runner */
#runner{position:fixed;inset:0;background:var(--bg);z-index:100;overflow-y:auto;max-width:480px;margin:0 auto}
#rhdr{position:sticky;top:0;background:rgba(10,12,16,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:14px 18px 10px;z-index:10}
#tbox{border-radius:16px;padding:18px 20px;margin-top:14px;border:2px solid var(--purple);background:rgba(62,37,245,.08)}
#tnum{font-size:76px;font-weight:900;text-align:center;line-height:1;font-family:'Barlow Condensed',sans-serif;color:var(--yellow)}
/* Modals */
.modal-wrap{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:200;display:flex;flex-direction:column;justify-content:flex-end}
.modal-backdrop{position:absolute;inset:0}
.modal-inner{background:var(--card);border-radius:22px 22px 0 0;padding:24px 22px 44px;border:1px solid var(--border);max-height:85vh;overflow-y:auto;animation:si .2s ease;position:relative;z-index:1}
.modal-drag{width:44px;height:5px;background:var(--border2);border-radius:3px;margin:0 auto 22px}
/* Chat */
#cwrap{display:flex;flex-direction:column;height:calc(100vh - 64px);padding-top:18px}
#cmsgs{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.mu{align-self:flex-end;max-width:86%;background:var(--purple);color:#fff;padding:13px 16px;border-radius:18px 18px 4px 18px;font-size:15px;line-height:1.75}
.ma{align-self:flex-start;max-width:86%;background:var(--card);color:var(--text);padding:13px 16px;border-radius:18px 18px 18px 4px;font-size:15px;line-height:1.75;border:1px solid var(--border);white-space:pre-wrap}
#cbar{padding:12px 14px;border-top:1px solid var(--border);display:flex;gap:10px;background:var(--bg)}
/* Splash */
#splash{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center}
</style>
</head>

const getWk=()=>{const n=new Date(),j=new Date(n.getFullYear(),0,1),w=Math.ceil(((n-j)/86400000+j.getDay()+1)/7);return`${n.getFullYear()}-W${w}`;};

function beep(f=880,d=.4){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=f;g.gain.setValueAtTime(.4,c.currentTime);g.gain.exponentialRampToValueAtTime(.01,c.currentTime+d);o.start(c.currentTime);o.stop(c.currentTime+d);}catch(e){}}

function extractJSON(txt){
  if(!txt)return null;
  const clean=txt.replace(/```json/gi,"").replace(/```/g,"").trim();
  const s=clean.indexOf("{"),e=clean.lastIndexOf("}");
  if(s===-1||e<=s)return null;
  const str=clean.slice(s,e+1);
  const tryP=src=>{try{const j=JSON.parse(src);if(j.exercises&&!j.exercices)j.exercices=j.exercises;if(j&&j.titre)return j;}catch(e){}return null;};
  return tryP(str)||tryP(str.replace(/,(\s*[}\]])/g,"$1"))||null;
}


// ── Deadline countdown ──
function parseDeadlinedays(str){
  if(!str)return null;
  const wm=str.match(/(\d+)\s*(semaine|sem|week)/i);
  if(wm)return parseInt(wm[1])*7;
  const months={jan:0,fév:1,fev:1,feb:1,mar:2,avr:3,apr:3,mai:4,may:4,jun:5,jul:6,aoû:7,aou:7,aug:7,sep:8,oct:9,nov:10,déc:11,dec:11};
  const mm=str.match(/(\d{1,2})[\s\/\-](\w+)[\s\/\-](\d{4})/i);
  if(mm){const mo=months[mm[2].toLowerCase().slice(0,3)];if(mo!==undefined){const d=new Date(+mm[3],mo,+mm[1]);return Math.max(0,Math.ceil((d-new Date())/86400000));}}
  const dm=str.match(/(\d{4})[\-\/](\d{1,2})[\-\/](\d{1,2})/);
  if(dm){const d=new Date(+dm[1],+dm[2]-1,+dm[3]);return Math.max(0,Math.ceil((d-new Date())/86400000));}
  return null;
}
function renderCountdown(){
  const dl=S.profile?.deadline;if(!dl)return"";
  const days=parseDeadlinedays(dl);

// ── Weight progression chart ──
function renderWeightCharts(){
  const log=Object.entries(S.weightLog).filter(([k,v])=>v.length>=2);

  return`<div style="margin-bottom:20px">
    <div class="label" style="margin-bottom:10px">📈 PROGRESSION DES CHARGES</div>
    ${log.slice(0,5).map(([name,entries])=>{
      const vals=entries.slice(-8).map(e=>({d:e.date,v:e.sets.reduce((a,b)=>a+(+b||0),0)/e.sets.length}));
      const maxV=Math.max(...vals.map(v=>v.v),1);
      const minV=Math.max(0,Math.min(...vals.map(v=>v.v))-5);
      const W=260,H=60,pad=4;
      const xStep=(W-pad*2)/(vals.length-1||1);
      const pts=vals.map((v,i)=>({x:pad+i*xStep,y:H-pad-(v.v-minV)/(maxV-minV+0.01)*(H-pad*2)}));
      const polyline=pts.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
      const lastVal=vals[vals.length-1];
      const firstVal=vals[0];
      const diff=lastVal.v-firstVal.v;
      const trend=diff>0?"↑":"↓";
      const trendColor=diff>0?"var(--yellow)":"var(--red)";
      return`<div class="card" style="margin-bottom:10px;padding:14px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <div style="font-size:13px;font-weight:700;color:var(--text)">${name}</div>
          <div style="display:flex;align-items:center;gap:8px">
            <span style="color:var(--text3);font-size:11px">${vals.length} sessions</span>
            <span style="color:${trendColor};font-size:14px;font-weight:700">${trend} ${Math.abs(diff).toFixed(1)}kg</span>
          </div>
        </div>
        <svg width="100%" viewBox="0 0 ${W} ${H}" style="overflow:visible">
          <defs><linearGradient id="g${name.replace(/\s/g,'')}" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="var(--purple)" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="var(--yellow)" stop-opacity="0.9"/>
          </linearGradient></defs>
          ${[0.25,0.5,0.75].map(r=>`<line x1="${pad}" x2="${W-pad}" y1="${(H-pad)-r*(H-pad*2)}" y2="${(H-pad)-r*(H-pad*2)}" stroke="rgba(255,255,255,.06)" stroke-width="1"/>`).join("")}
          <polyline points="${polyline}" fill="none" stroke="url(#g${name.replace(/\s/g,'')})" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          ${pts.map((p,i)=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="${i===pts.length-1?"var(--yellow)":"var(--purple2)"}" stroke="var(--bg)" stroke-width="2"/>`).join("")}
          <text x="${pts[pts.length-1].x}" y="${pts[pts.length-1].y-8}" text-anchor="middle" fill="var(--yellow)" font-size="10" font-family="'Barlow Condensed'" font-weight="700">${lastVal.v.toFixed(1)}kg</text>
        </svg>
        <div style="display:flex;justify-content:space-between;margin-top:4px">
          <span style="color:var(--text3);font-size:10px">${firstVal.d}</span>
          <span style="color:var(--text3);font-size:10px">${lastVal.d}</span>
        </div>
      </div>`;
    }).join("")}
  </div>`;
}

async function _fetchAPI(model,maxTok,msgs,sys){
  let r;
  try{r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":S.apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model,max_tokens:maxTok,stream:true,system:sys||SYS(),messages:msgs})});}
  catch(e){throw new Error("📡 Erreur réseau — vérifie ta connexion");}
  if(!r.ok){try{const d=await r.json();const m=JSON.stringify(d);if(m.includes("exceeded_limit")||m.includes("credit"))throw new Error("💳 Crédit épuisé → console.anthropic.com → Billing");if(m.includes("rate_limit"))throw new Error("⏳ Limite dépassée — attends 2-3 min");if(m.includes("auth"))throw new Error("🔑 Clé API invalide");throw new Error("Erreur API "+r.status);}catch(e){throw e;}}
  const reader=r.body.getReader(),dec=new TextDecoder();
  let full="",buf="";
  try{while(true){const{done,value}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});const lines=buf.split("\n");buf=lines.pop()||"";for(const l of lines){if(!l.startsWith("data: "))continue;const d=l.slice(6).trim();if(d==="[DONE]")continue;try{const p=JSON.parse(d);if(p.type==="content_block_delta"&&p.delta?.type==="text_delta")full+=p.delta.text;}catch(pe){}}}}catch(se){reader.cancel();throw se;}
  return full;
}

  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(!data.profile)throw new Error("Fichier invalide");
      if(!confirm("Restaurer les données depuis ce fichier ? Les données actuelles seront remplacées."))return;
      S.profile=data.profile||null;
      S.log=data.log||[];
      S.weightLog=data.weightLog||{};

      S.foodLog=data.foodLog||[];

      sv("vc_weights",S.weightLog);
      sv("vc_bw",S.bodyWeights);
      sv("vc_food",S.foodLog);

// ── Timer ──
let timerInt=null;
function startTimer(dur,label,isLast){
  clearInterval(timerInt);
  S.timer={active:true,rem:dur,label,isLast,_dur:dur};
  updateTimer();
  timerInt=setInterval(()=>{
    S.timer.rem--;
    if(S.timer.rem<=3&&S.timer.rem>0)beep(440,.12);
    if(S.timer.rem<=0){clearInterval(timerInt);beep(880,.8);S.timer.active=false;if(isLast&&S.runner){S.runner.exIdx++;S.runner.doneSets=[];S.runner.weights=[];}renderRunner();return;}
    updateTimer();
  },1000);
}
function stopTimer(){clearInterval(timerInt);S.timer.active=false;}
function updateTimer(){
  const box=document.getElementById("tbox"),num=document.getElementById("tnum"),bar=document.getElementById("tbar"),lbl=document.getElementById("tlbl");
  if(!box||!num)return;
  const{rem,_dur,label,active}=S.timer;
  if(!active){box.style.display="none";return;}
  box.style.display="block";
  const urgent=rem<=10;
  box.style.borderColor=urgent?"var(--red)":"var(--purple)";
  box.style.background=urgent?"rgba(248,113,113,.08)":"rgba(62,37,245,.08)";
  const min=Math.floor(rem/60),sec=rem%60;
  num.textContent=min>0?`${min}:${sec.toString().padStart(2,"0")}`:rem;
  num.style.color=urgent?"var(--red)":"var(--yellow)";
  const pct=Math.max(0,((_dur-rem)/_dur)*100);
  if(bar){bar.style.width=pct+"%";bar.style.background=urgent?"var(--red)":"var(--yellow)";}
  if(lbl)lbl.textContent=label;

  }).join("");
}

// ── Progress ──
function renderProgress(){
  const p=S.profile,log=S.log;
  const wk=getWk(),wt=parseInt(p.spw||3);
  const wd=log.filter(s=>s.week===wk&&s.done).length;
  const wp=Math.min(100,Math.round((wd/wt)*100));
  const wc=wp>=100?"var(--yellow)":wp>=50?"var(--amber)":"var(--red)";
  const tw=parseWks(p.deadline),tt=tw?tw*wt:null;
  const td=log.filter(s=>s.done).length;
  const tp=tt?Math.min(100,Math.round((td/tt)*100)):null;
  return`<div class="card" style="margin-bottom:20px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <span class="label" style="margin:0">CETTE SEMAINE</span>
      <span style="color:${wc};font-size:26px;font-weight:900;font-family:'Barlow Condensed',sans-serif">${wd}<span style="color:var(--text3);font-size:16px;font-weight:400">/${wt}</span></span>
    </div>
    <div class="pbar"><div class="pfill" style="width:${wp}%;background:${wc}"></div></div>
    <div style="display:flex;justify-content:space-between;margin-top:5px">
      <span style="color:${wc};font-size:12px;font-weight:700;font-family:'Barlow Condensed',sans-serif;letter-spacing:1px">${wp}% ACCOMPLI</span>
      <span style="color:var(--text3);font-size:12px">${wt-wd>0?`${wt-wd} séance${wt-wd>1?"s":""} restante${wt-wd>1?"s":""}`:"✅ Semaine complète !"}</span>
    </div>
    ${tp!==null?`<div style="border-top:1px solid var(--border);margin-top:14px;padding-top:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span class="label" style="margin:0">OBJECTIF GLOBAL</span>
        <span style="color:var(--yellow);font-size:26px;font-weight:900;font-family:'Barlow Condensed',sans-serif">${td}<span style="color:var(--text3);font-size:16px;font-weight:400">/${tt}</span></span>
      </div>
      <div class="pbar"><div class="pfill" style="width:${tp}%;background:linear-gradient(90deg,var(--yellow),var(--purple2))"></div></div>
      <div style="display:flex;justify-content:space-between;margin-top:5px">
        <span style="color:var(--yellow);font-size:12px;font-weight:700;font-family:'Barlow Condensed',sans-serif;letter-spacing:1px">${tp}% DE L'OBJECTIF</span>
        <span style="color:var(--text3);font-size:12px">${tt-td} séances restantes</span>
      </div>
    </div>`:""}
  </div>`;
}

        </div>
        <div style="background:var(--surface);border-radius:10px;padding:10px;text-align:center">

        Il reste <strong style="color:var(--yellow)">${tgt-totCal} kcal</strong> et <strong style="color:var(--purple2)">${(prot||0)-totProt}g de protéines</strong>

// ── Recovery ──
function renderRecup(){
  const last=S.sleepLog.slice(-1)[0];
  let score=null;
  if(last){let s=0;const h=last.hours;s+=h>=8&&h<=9?40:h>=7?30:h>=6?18:10;s+=Math.round((last.quality/5)*30);if(last.hrv)s+=last.hrv>=60?30:last.hrv>=40?20:last.hrv>=25?12:6;else if(last.hr)s+=last.hr<=50?30:last.hr<=58?22:last.hr<=65?14:8;else s+=15;score=Math.min(100,s);}
  const sc=score===null?"var(--text3)":score>=80?"var(--yellow)":score>=60?"var(--amber)":"var(--red)";
  return`<div style="padding:22px 0 20px">
    <h2 class="heading" style="font-size:30px;margin-bottom:4px">RÉCUPÉRATION</h2>
    <p style="color:var(--text2);font-size:13px;margin-bottom:18px">Sommeil · Siestes · Apple Watch</p>

      <div class="label">SCORE RÉCUPÉRATION</div>
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:72px;font-weight:900;color:${sc};line-height:1">${score}</div>
      <div style="font-size:14px;color:${sc};margin:4px 0 12px;font-family:'Barlow Condensed',sans-serif;letter-spacing:1px">${score>=80?"🟢 EXCELLENT":score>=60?"🟡 CORRECT":"🔴 INSUFFISANT"}</div>
      <div class="pbar" style="height:7px"><div class="pfill" style="width:${score}%;background:${sc}"></div></div>
    </div>`:""}
    <div class="card" style="margin-bottom:14px">
      <div class="label">😴 LOG SOMMEIL</div>
      <div style="display:flex;gap:8px;margin-bottom:10px">
        <input id="sl-h" type="number" step="0.5" min="1" max="12" placeholder="Heures" style="flex:2">
        <input id="sl-hr" type="number" placeholder="FC repos" style="flex:1">

      <div class="label">QUALITÉ DU SOMMEIL</div>
      <div style="display:flex;gap:6px;margin-bottom:12px">
        ${[1,2,3,4,5].map(n=>`<button data-action="sleep-q" data-val="${n}" style="flex:1;padding:10px 0;border-radius:10px;border:2px solid ${S.sleepQ>=n?"var(--yellow)":"var(--border)"};background:${S.sleepQ>=n?"rgba(238,255,0,.08)":"var(--card)"};color:${S.sleepQ>=n?"var(--yellow)":"var(--text3)"};font-size:18px;cursor:pointer">★</button>`).join("")}
      </div>
      <button data-action="log-sleep" class="btn-ghost">+ ENREGISTRER</button>
    </div>
    <div class="card" style="margin-bottom:14px">
      <div class="label">💤 LOG SIESTE</div>
      <input id="si-m" type="number" placeholder="Durée (minutes)" style="margin-bottom:10px">
      <p style="color:var(--text3);font-size:12px;margin-bottom:10px">Idéal : 20-25 min (power nap) ou 90 min</p>
      <button data-action="log-siesta" class="btn-ghost">+ ENREGISTRER</button>
    </div>
    ${S.sleepLog.slice(-7).length>0?`<div style="margin-bottom:14px">
      <div class="label">7 DERNIÈRES NUITS</div>
      ${S.sleepLog.slice(-7).slice().reverse().map(s=>`<div class="card" style="margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">
        <div>
          <div style="font-size:14px;font-weight:700">${s.date}</div>

    <button data-action="get-recup" class="btn-outline" style="margin-bottom:18px" ${S.recup_l?"disabled":""}>${S.recup_l?`<span style="display:flex;justify-content:center"><span class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span></span>`:"🧬 ANALYSE & CONSEILS RÉCUP"}</button>
    ${S.recup_r?`<div class="card" style="color:var(--text2);font-size:15px;line-height:1.85;white-space:pre-wrap">${S.recup_r}</div>`:""}

// ── Events ──
document.getElementById("app").addEventListener("click",async e=>{
  const btn=e.target.closest("[data-action]");
  if(!btn)return;
  const a=btn.dataset.action,v=btn.dataset.val;

  if(a==="save-key"){const k=document.getElementById("ki")?.value?.trim();if(k?.startsWith("sk-")){S.apiKey=k;localStorage.setItem("vc_key",k);render();}else alert("Clé invalide — commence par sk-");return;}
  if(a==="ob-next"){
    const f=S.obForm,step=S.obStep;
    if(step===0){f.name=document.getElementById("ob-name")?.value||f.name;f.age=document.getElementById("ob-age")?.value||f.age;f.deadline=document.getElementById("ob-deadline")?.value||f.deadline;}
    if(step===1){f.height=document.getElementById("ob-h")?.value||f.height;f.cw=document.getElementById("ob-cw")?.value||f.cw;f.tw=document.getElementById("ob-tw")?.value||f.tw;}
    if(step<5){S.obStep++;render();}
    else{S.profile={...f};S.obStep=0;sv("vc_profile",S.profile);render();}
    return;
  }
  if(a==="ob-back"){S.obStep=Math.max(0,S.obStep-1);render();return;}
  if(a==="ob-spw"){S.obForm.spw=v;render();return;}
  if(a==="ob-goal"){S.obForm.bgoal=v;render();return;}
  if(a==="ob-pos"){S.obForm.pos=v;render();return;}
  if(a==="ob-lvl"){S.obForm.level=v;render();return;}
  if(a==="ob-obj"){const arr=S.obForm.obj;S.obForm.obj=arr.includes(v)?arr.filter(x=>x!==v):[...arr,v];render();return;}
  if(a==="ob-weak"){const arr=S.obForm.weak;S.obForm.weak=arr.includes(v)?arr.filter(x=>x!==v):[...arr,v];render();return;}
  if(a==="tab"){S.tab=v;render();return;}
  if(a==="stype"){S.stype=v;render();return;}
  if(a==="stime"){S.stime=v;render();return;}
  if(a==="show-injuries"){S.show_injuries=true;render();return;}
  if(a==="close-injuries"){S.show_injuries=false;render();return;}
  if(a==="add-inj"){
    S.injuries=[...S.injuries,{id:Date.now(),zone:S.inj_zone,side:S.inj_side,level:S.inj_level,date:fmtD(),active:true}];
    sv("vc_injuries",S.injuries);render();return;
  }
  if(a==="del-inj"){S.injuries=S.injuries.filter((_,i)=>i!==+btn.dataset.idx);sv("vc_injuries",S.injuries);render();return;}
  if(a==="heal-inj"){S.injuries[+btn.dataset.idx].active=false;sv("vc_injuries",S.injuries);render();return;}
  if(a==="lvl-inj"){S.injuries[+btn.dataset.idx].level=+btn.dataset.lvl;sv("vc_injuries",S.injuries);render();return;}
  if(a==="inj-side"){S.inj_side=btn.dataset.val;render();return;}
  if(a==="inj-level"){S.inj_level=+btn.dataset.val;render();return;}
  if(a==="export-data"){exportData();return;}
  if(a==="reset"){if(confirm("Réinitialiser tout ?")){localStorage.clear();S.apiKey="";S.profile=null;S.log=[];render();}return;}
  if(a==="show-bw"){S.show_bw=true;render();return;}
  if(a==="close-bw"){S.show_bw=false;render();return;}
  if(a==="add-bw"){const vl=document.getElementById("bwi")?.value;if(!vl)return;S.bodyWeights=[...S.bodyWeights,{date:fmtD(),w:parseFloat(vl)}].slice(-30);sv("vc_bw",S.bodyWeights);render();return;}
  if(a==="generate"){
    S.generating=true;S.error="";S.pending=null;render();
    let j=null,lastErr="";
    for(let attempt=0;attempt<3;attempt++){
      try{
        const btn2=document.querySelector("[data-action='generate']");
        if(attempt>0&&btn2)btn2.innerHTML=`⏳ Tentative ${attempt+1}/3…`;
        const txt=await callAPI([{role:"user",content:PPROMPT(S.stype)}]);
        S._raw=txt;j=extractJSON(txt);
        if(j)break;lastErr="Format incorrect (tentative "+(attempt+1)+"/3)";
      }catch(er){lastErr=er.message;const isNet=er.message.includes("réseau")||er.message.toLowerCase().includes("network")||er.message.includes("stream");if(!isNet)break;}
    }
    if(j){S.pending={...j,type:S.stype,sessionTime:S.stime};}
    else{S.error=lastErr+(S._raw?"\n\nRéponse:\n"+S._raw.substring(0,200):"");}
    S.generating=false;render();return;
  }
  if(a==="start-session"){
    const sess=S.pending;
    const entry={id:Date.now(),...sess,date:fmtD(),week:getWk(),done:false};
    S.log=[entry,...S.log];sv("vc_sessions",S.log);
    S.runner={session:entry,exIdx:0,doneSets:[],weights:[]};
    S.pending=null;render();return;
  }
  if(a==="save-session"){if(!S.pending)return;const entry={id:Date.now(),...S.pending,date:fmtD(),week:getWk(),done:false};S.log=[entry,...S.log];sv("vc_sessions",S.log);S.pending=null;render();return;}
  if(a==="resume-s"){const s=S.log[parseInt(btn.dataset.idx)];S.runner={session:s,exIdx:0,doneSets:[],weights:[]};render();return;}
  if(a==="expand-s"){const sid=btn.dataset.id;S.expandedSessions={...S.expandedSessions,[sid]:!S.expandedSessions[sid]};render();return;}
  if(a==="toggle-s"){const i=parseInt(btn.dataset.idx);S.log=S.log.map((s,idx)=>idx===i?{...s,done:!s.done}:s);sv("vc_sessions",S.log);render();return;}
  if(a==="del-s"){if(!confirm("Supprimer ?"))return;S.log=S.log.filter((_,idx)=>idx!==parseInt(btn.dataset.idx));sv("vc_sessions",S.log);render();return;}
  if(a==="mark-set"){
    const i=parseInt(btn.dataset.set);if(!S.runner||S.runner.doneSets.includes(i))return;
    S.runner.doneSets=[...S.runner.doneSets,i];beep(440,.12);
    const isLast=S.runner.doneSets.length>=S.runner.session.exercices[S.runner.exIdx].series;
    const ex=S.runner.session.exercices[S.runner.exIdx];
    renderRunnerInPlace();
    startTimer(isLast?ex.repos_exercice:ex.repos_serie,isLast?`⏸ PAUSE INTER-EXERCICE — ${ex.repos_exercice}S`:`⏱ RÉCUP ENTRE SÉRIES — ${ex.repos_serie}S`,isLast);
    return;
  }
  if(a==="save-weights"){if(!S.runner)return;const ex=S.runner.session.exercices[S.runner.exIdx];const wts=S.runner.weights.filter(w=>w);if(!wts.length)return;const entry={date:fmtD(),sets:wts};S.weightLog={...S.weightLog,[ex.nom]:[...(S.weightLog[ex.nom]||[]),entry].slice(-15)};sv("vc_weights",S.weightLog);alert("✓ Charges sauvegardées");return;}
  if(a==="next-ex"){stopTimer();if(S.runner){S.runner.exIdx++;S.runner.doneSets=[];S.runner.weights=[];}render();return;}
  if(a==="prev-ex"){stopTimer();if(S.runner&&S.runner.exIdx>0){S.runner.exIdx--;S.runner.doneSets=[];S.runner.weights=[];}render();return;}
  if(a==="skip-timer"){stopTimer();if(S.timer.isLast&&S.runner){S.runner.exIdx++;S.runner.doneSets=[];S.runner.weights=[];}render();return;}
  if(a==="close-runner"){stopTimer();S.runner=null;render();return;}
  if(a==="finish-s"){stopTimer();if(S.runner){const s=S.runner.session;const ei=S.log.findIndex(l=>l.id===s.id);if(ei>=0)S.log[ei].done=true;else S.log=[{id:Date.now(),...s,date:fmtD(),week:getWk(),done:true},...S.log];sv("vc_sessions",S.log);}S.runner=null;S.tab="program";render();return;}
  if(a==="show-info"){S.info_ex=S.runner?.session?.exercices?.[parseInt(btn.dataset.idx)];render();return;}
  if(a==="close-info"){S.info_ex=null;render();return;}
  if(a==="food-meal"){S.foodMeal=v;render();return;}
  if(a==="del-food"){const today=new Date().toLocaleDateString("fr-FR",{day:"numeric",month:"short"});const tLog=S.foodLog.filter(e=>e.date===today);const entry=tLog[parseInt(btn.dataset.idx)];S.foodLog=S.foodLog.filter(e=>e!==entry);sv("vc_food",S.foodLog);render();return;}
  if(a==="analyze-food"){
    const txt=document.getElementById("food-inp")?.value?.trim();if(!txt)return;
    S.foodAnal=true;render();
    try{
      const res=await callAPIJSON(
        [{role:"user",content:"Repas: "+txt}],
        "Tu es nutritionniste. Réponds UNIQUEMENT avec un objet JSON sur une ligne, sans markdown, sans texte. Format exact: {\"calories\":0,\"proteines\":0,\"glucides\":0,\"lipides\":0}"
      );
      const clean=res.replace(/```json/gi,"").replace(/```/g,"").trim();
      const s=clean.indexOf("{"),ee=clean.lastIndexOf("}");
      if(s===-1||ee<=s){alert("Réponse inattendue: "+clean.slice(0,100));S.foodAnal=false;render();return;}
      const j=JSON.parse(clean.slice(s,ee+1));
      const today=new Date().toLocaleDateString("fr-FR",{day:"numeric",month:"short"});
      S.foodLog=[...S.foodLog,{date:today,meal:S.foodMeal,text:txt,
        cal:j.calories||j.kcal||0,
        prot:j.proteines||j["prot\u00e9ines"]||j.proteins||0,
        gluc:j.glucides||j.carbs||0,
        lip:j.lipides||j.fats||j.fat||0}];
      sv("vc_food",S.foodLog);
      const inp=document.getElementById("food-inp");if(inp)inp.value="";
    }catch(er){alert("Erreur macros: "+er.message);}
    S.foodAnal=false;render();return;
  }
  if(a==="nut-t"){S.nut_t=v;render();return;}
  if(a==="get-nut"){
    const p=S.profile,hasBMI=p.height&&p.cw;
    const tdee=hasBMI?calcTDEE(calcBMR(+p.cw,+p.height,+p.age)):null;
    const tgt=tdee?calcTgt(tdee,p.bgoal):null,prot=hasBMI?calcProt(+p.cw,p.bgoal):null;
    const gInfo=GOALS.find(g=>g.id===p.bgoal);
    const P={avant:`Plan nutritionnel AVANT l'entraînement/match.${hasBMI?` Cible: ${tgt}kcal/j, ${prot}g protéines/j.`:""} Cite académies d'élite et recherche scientifique.`,pendant:"Nutrition PENDANT l'effort. Hydratation, collations. Cite recherche scientifique.",après:`Récupération APRÈS l'effort.${hasBMI?` Cible protéines: ${prot}g/j.`:""}`,quotidien:`Plan alimentaire complet journée d'entraînement.${hasBMI?` CIBLE EXACTE: ${tgt}kcal/j, ${prot}g protéines/j pour ${gInfo?.label}.`:""}`,compétition:"Protocole nutritionnel 3 jours pour la compétition. Méthodes clubs professionnels."};
    S.nut_l=true;S.nut_r=null;render();
    try{S.nut_r=await callAPIFast([{role:"user",content:P[S.nut_t]}]);}catch(er){S.nut_r="Erreur: "+er.message;}
    S.nut_l=false;render();return;
  }
  if(a==="mnt-t"){S.mnt_t=v;render();return;}
  if(a==="get-mnt"){
    const P={routine:"Routine de préparation mentale pré-match. Méthodes Man City, Ajax. Base scientifique.",confiance:"Techniques concrètes pour booster la confiance. Exercices pratiques. Académies d'élite.",pression:"Gérer la pression en match. Techniques actionnables. Science-based.",visualisation:"Script visualisation sportive 5 min. Adapté à mon poste.",resilience:"Protocole mental post-échec. Psychologie du sport.",sommeil:"Récupération par le sommeil pour footballeur."};
    S.mnt_l=true;S.mnt_r=null;render();
    try{S.mnt_r=await callAPIFast([{role:"user",content:P[S.mnt_t]}]);}catch(er){S.mnt_r="Erreur: "+er.message;}
    S.mnt_l=false;render();return;
  }
  if(a==="sleep-q"){S.sleepQ=parseInt(v);render();return;}
  if(a==="log-sleep"){const h=parseFloat(document.getElementById("sl-h")?.value||0);if(!h)return;const hr=parseFloat(document.getElementById("sl-hr")?.value||0);const hrv=parseFloat(document.getElementById("sl-hrv")?.value||0);S.sleepLog=[...S.sleepLog,{date:fmtD(),hours:h,quality:S.sleepQ,hr:hr||null,hrv:hrv||null}].slice(-30);sv("vc_sleep",S.sleepLog);render();return;}
  if(a==="log-siesta"){const m=parseInt(document.getElementById("si-m")?.value||0);if(!m)return;S.siestaLog=[...S.siestaLog,{date:fmtD(),minutes:m}].slice(-30);sv("vc_siesta",S.siestaLog);
      sv("vc_injuries",S.injuries||[]);render();return;}
  if(a==="get-recup"){
    const last3=S.sleepLog.slice(-3);const avgH=last3.length?Math.round(last3.reduce((a,s)=>a+s.hours,0)/last3.length*10)/10:null;
    const prompt=`Analyse ma récupération :${avgH?`\n- Sommeil moyen: ${avgH}h`:""}${S.sleepLog.slice(-1)[0]?.hr?`\n- FC repos: ${S.sleepLog.slice(-1)[0].hr}bpm`:""}${S.sleepLog.slice(-1)[0]?.hrv?`\n- HRV: ${S.sleepLog.slice(-1)[0].hrv}ms`:""}${S.siestaLog.length?`\n- Siestes récentes: ${S.siestaLog.slice(-3).map(s=>s.minutes+"min").join(", ")}`:""}
Conseils précis sur sommeil, récupération, siestes stratégiques. Protocoles académies Bayern, Man City + recherche scientifique.`;
    S.recup_l=true;S.recup_r=null;render();
    try{S.recup_r=await callAPIFast([{role:"user",content:prompt}]);}catch(er){S.recup_r="Erreur: "+er.message;}
    S.recup_l=false;render();return;
  }
  if(a==="send-chat"){const inp=document.getElementById("ci");const msg=inp?.value?.trim();if(!msg||S.chat_l)return;S.chat=[...S.chat,{r:"user",c:msg}];S.chat_l=true;render();try{const history=S.chat.slice(-6).map(m=>({role:m.r==="user"?"user":"assistant",content:m.c}));const res=await callAPIFast(history);S.chat=[...S.chat,{r:"assistant",c:res}];}catch(er){S.chat=[...S.chat,{r:"assistant",c:"Erreur: "+er.message}];}S.chat_l=false;render();return;}
});

function renderRunnerInPlace(){
  const r=S.runner;if(!r)return;
  const done=r.doneSets||[];
  document.querySelectorAll("[data-action='mark-set']").forEach((btn,i)=>{
    const d=done.includes(i);
    btn.style.borderColor=d?"var(--yellow)":"var(--border2)";
    btn.style.background=d?"var(--yellow)":"var(--card)";
    btn.style.color=d?"var(--bg)":"var(--text2)";
    btn.textContent=d?"✓":`S${i+1}`;
  });
}

// ── PWA Icon (canvas → blob) ──
(function(){
  const LOGO_SRC = document.querySelector('#slogo')?.src || "";
  if(!LOGO_SRC) return;
  const img = new Image();
  img.crossOrigin = "anonymous";
  img.onload = function(){
    [192, 512].forEach(size => {
      const c = document.createElement('canvas');
      c.width = size; c.height = size;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#0A0C10';
      ctx.fillRect(0, 0, size, size);
      // Centrer le logo avec padding
      const pad = size * 0.1;
      ctx.drawImage(img, pad, pad, size - pad*2, size - pad*2);
      c.toBlob(blob => {
        if(!blob) return;
        const url = URL.createObjectURL(blob);
        if(size === 192){
          // Apple touch icon
          const link = document.getElementById('pwa-icon');
          if(link) link.href = url;
          // Manifest
          const manifest = {
            name: "VISTACOACH",
            short_name: "VISTACOACH",
            description: "Ton coach football IA science-based",
            start_url: ".",
            display: "standalone",
            background_color: "#0A0C10",
            theme_color: "#0A0C10",
            orientation: "portrait",
            icons: [{src: url, sizes: "192x192", type: "image/png"}]
          };
          const mBlob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
          const mUrl = URL.createObjectURL(mBlob);
          const mLink = document.getElementById('pwa-manifest');
          if(mLink) mLink.href = mUrl;
        }
      }, 'image/png');
    });
  };
  img.onerror = function(){ console.log('PWA icon: logo non chargé'); };
  img.src = LOGO_SRC;
})();

  },2000);
},100);
