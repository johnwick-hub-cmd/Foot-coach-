<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VISTACOACH</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VISTACOACH">
<meta name="theme-color" content="#0A0C10">
<link rel="apple-touch-icon" id="pwa-icon" href="">
<link rel="manifest" id="pwa-manifest" href="">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0C10;--card:#131921;--surface:#1a2030;
  --border:#1E2530;--border2:#2a3040;
  --yellow:#EEFF00;--purple:#3E25F5;--purple2:#5B42F5;
  --text:#ffffff;--text2:#8892A0;--text3:#4A5568;
  --red:#f87171;--amber:#f59e0b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:'Inter',sans-serif;color:var(--text);font-size:16px;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
input,button,select,textarea{font-family:'Inter',sans-serif}
input{width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:16px}
input::placeholder{color:var(--text3)}
input:focus{outline:none;border-color:var(--yellow)!important;box-shadow:0 0 0 2px rgba(238,255,0,.1)}
textarea{width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:15px;resize:none;line-height:1.5}
textarea:focus{outline:none;border-color:var(--yellow)!important}
::-webkit-scrollbar{width:0}
.heading{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:1px}
.screen{min-height:100vh;padding:0 20px 40px;max-width:480px;margin:0 auto}
.pill{padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text2);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.pill.active{border-color:var(--purple);background:var(--purple);color:#fff;font-weight:700}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px}
.label{color:var(--yellow);font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;display:block;margin-bottom:10px}
.btn-main{width:100%;padding:16px;border-radius:12px;background:var(--yellow);color:var(--bg);font-size:16px;font-weight:800;font-family:'Barlow Condensed',sans-serif;letter-spacing:2px;text-transform:uppercase;cursor:pointer;border:none;transition:all .15s}
.btn-main:active{transform:scale(.98);background:#d4e000}
.btn-outline{width:100%;padding:16px;border-radius:12px;background:transparent;border:2px solid var(--yellow);color:var(--yellow);font-size:15px;font-weight:700;font-family:'Barlow Condensed',sans-serif;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:all .15s}
.btn-outline:active{background:rgba(238,255,0,.08)}
.btn-ghost{width:100%;padding:13px;border-radius:10px;background:none;border:1px solid var(--border2);color:var(--text2);font-size:14px;font-weight:600;cursor:pointer;transition:all .15s}
.tag{display:inline-block;padding:5px 12px;border-radius:6px;background:var(--purple);color:#fff;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
@keyframes su{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes si{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.su{animation:su .22s ease forwards}
.dots{display:flex;gap:6px;padding:14px 0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--yellow)}
.dot:nth-child(1){animation:pulse 1.2s .0s infinite}
.dot:nth-child(2){animation:pulse 1.2s .2s infinite}
.dot:nth-child(3){animation:pulse 1.2s .4s infinite}




/* ── Loading Overlay ── */
#vc-loader{position:fixed;inset:0;background:rgba(6,8,12,.97);z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;backdrop-filter:blur(12px)}
#vc-loader .loader-glow{position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(62,37,245,.25) 0%,transparent 70%);pointer-events:none}
#vc-loader .loader-ring{transform:rotate(-90deg)}
#vc-loader .loader-track{fill:none;stroke:rgba(255,255,255,.06);stroke-width:3}
#vc-loader .loader-fill{fill:none;stroke:url(#lgrad);stroke-width:3;stroke-linecap:round;stroke-dasharray:283;stroke-dashoffset:283;transition:stroke-dashoffset .6s ease}
#vc-loader .loader-pct{font-family:'Bebas Neue',sans-serif;font-size:52px;color:var(--yellow);letter-spacing:2px;margin-top:24px;line-height:1}
#vc-loader .loader-msg{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:3px;color:var(--text3);margin-top:8px;text-transform:uppercase;text-align:center;max-width:260px;min-height:22px;transition:opacity .3s}
#vc-loader .loader-sub{font-size:12px;color:var(--purple2);font-family:'Barlow Condensed',sans-serif;letter-spacing:2px;margin-top:6px;opacity:.7}
@keyframes loaderPulse{0%,100%{opacity:.4;transform:scale(.97)}50%{opacity:1;transform:scale(1)}}


/* ── Content Renderer ── */
.vc-content{font-family:'Inter',sans-serif;font-size:14px;color:var(--text2);line-height:1.8}
.vc-h1{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;color:var(--yellow);margin:0 0 4px;line-height:1}
.vc-h1-bar{width:36px;height:3px;background:var(--yellow);border-radius:2px;margin-bottom:20px}
.vc-section{margin-bottom:24px;padding:18px 20px;background:rgba(255,255,255,.025);border-radius:14px;border-left:3px solid var(--purple)}
.vc-section-title{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:3px;color:var(--purple2);text-transform:uppercase;margin-bottom:14px}
.vc-phase{margin-bottom:16px;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.vc-phase-hdr{background:rgba(62,37,245,.12);border-bottom:1px solid var(--border);padding:10px 14px;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;color:var(--purple2);text-transform:uppercase;display:flex;align-items:center;gap:8px}
.vc-phase-hdr::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--purple2);flex-shrink:0}
.vc-phase-body{padding:14px}
.vc-sub{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--yellow);text-transform:uppercase;margin:12px 0 8px;display:flex;align-items:center;gap:8px}
.vc-sub::after{content:"";flex:1;height:1px;background:rgba(238,255,0,.15)}
.vc-li{display:flex;gap:10px;margin-bottom:6px;align-items:flex-start;font-size:13px}
.vc-li-acc{width:4px;height:4px;border-radius:50%;background:var(--yellow);margin-top:7px;flex-shrink:0}
.vc-p{font-size:13px;color:var(--text2);line-height:1.8;margin-bottom:8px}
.vc-strong{color:var(--white);font-weight:600}
.vc-source{font-size:11px;color:var(--purple2);font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;opacity:.7;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.vc-kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin-bottom:12px}
.vc-kv-k{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--text3);text-transform:uppercase;white-space:nowrap;padding-top:2px}
.vc-kv-v{font-size:13px;color:var(--text);font-weight:500}
.vc-table{width:100%;border-collapse:collapse;margin:10px 0;font-size:12px}
.vc-table th{background:rgba(62,37,245,.15);color:var(--purple2);font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:8px 10px;text-align:left;border-bottom:1px solid var(--border)}
.vc-table td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.04);color:var(--text2);vertical-align:top}
.vc-table tr:last-child td{border-bottom:none}
.vc-table .vc-td-bold{color:var(--white);font-weight:600}
.vc-badge-crit{display:inline-block;padding:2px 8px;background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.3);border-radius:4px;font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:1px;color:#f87171}
.vc-badge-high{display:inline-block;padding:2px 8px;background:rgba(238,255,0,.08);border:1px solid rgba(238,255,0,.25);border-radius:4px;font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:1px;color:var(--yellow)}
.vc-badge-med{display:inline-block;padding:2px 8px;background:rgba(123,95,255,.1);border:1px solid rgba(123,95,255,.25);border-radius:4px;font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:1px;color:var(--purple2)}

/* Nav */
#bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(10,12,16,.96);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;padding:10px 0 22px;z-index:50}
.nb{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;cursor:pointer}
.ni{font-size:22px}
.nl{font-size:10px;font-weight:700;color:var(--text3);font-family:'Barlow Condensed',sans-serif;letter-spacing:1.5px;text-transform:uppercase}
.nl.on{color:var(--yellow)}
.nd{width:5px;height:5px;border-radius:50%;background:var(--yellow)}
/* Header */
#hdr{position:sticky;top:0;z-index:40;background:rgba(10,12,16,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:12px 18px 10px;display:flex;justify-content:space-between;align-items:center;max-width:480px;margin:0 auto}
/* Progress */
.pbar{height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin:6px 0}
.pfill{height:100%;border-radius:3px;transition:width .5s ease}
/* Runner */
#runner{position:fixed;inset:0;background:var(--bg);z-index:100;overflow-y:auto;max-width:480px;margin:0 auto}
#rhdr{position:sticky;top:0;background:rgba(10,12,16,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:14px 18px 10px;z-index:10}
#tbox{border-radius:16px;padding:18px 20px;margin-top:14px;border:2px solid var(--purple);background:rgba(62,37,245,.08)}
#tnum{font-size:76px;font-weight:900;text-align:center;line-height:1;font-family:'Barlow Condensed',sans-serif;color:var(--yellow)}
/* Modals */
.modal-wrap{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:200;display:flex;flex-direction:column;justify-content:flex-end}
.modal-backdrop{position:absolute;inset:0}
.modal-inner{background:var(--card);border-radius:22px 22px 0 0;padding:24px 22px 44px;border:1px solid var(--border);max-height:85vh;overflow-y:auto;animation:si .2s ease;position:relative;z-index:1}
.modal-drag{width:44px;height:5px;background:var(--border2);border-radius:3px;margin:0 auto 22px}
/* Chat */
#cwrap{display:flex;flex-direction:column;height:calc(100vh - 64px);padding-top:18px}
#cmsgs{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.mu{align-self:flex-end;max-width:86%;background:var(--purple);color:#fff;padding:13px 16px;border-radius:18px 18px 4px 18px;font-size:15px;line-height:1.75}
.ma{align-self:flex-start;max-width:86%;background:var(--card);color:var(--text);padding:13px 16px;border-radius:18px 18px 18px 4px;font-size:15px;line-height:1.75;border:1px solid var(--border);white-space:pre-wrap}
#cbar{padding:12px 14px;border-top:1px solid var(--border);display:flex;gap:10px;background:var(--bg)}
/* Splash */
#splash{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center}

/* ── Design System v2 ── */

/* Micro-animations */
@keyframes tabFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes btnPulseAnim{0%{box-shadow:0 0 0 0 rgba(238,255,0,.5)}60%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes radarDraw{from{stroke-dashoffset:2000}to{stroke-dashoffset:0}}
@keyframes axesDraw{from{opacity:0;stroke-dashoffset:120}to{opacity:1;stroke-dashoffset:0}}

.tab-anim{animation:tabFade .18s cubic-bezier(.25,.46,.45,.94) forwards}
.card-in{animation:cardIn .22s ease forwards;animation-fill-mode:both}
.card-in:nth-child(1){animation-delay:0ms}
.card-in:nth-child(2){animation-delay:40ms}
.card-in:nth-child(3){animation-delay:80ms}
.card-in:nth-child(4){animation-delay:120ms}
.card-in:nth-child(5){animation-delay:160ms}
.card-in:nth-child(n+6){animation-delay:200ms}

/* Button pulse on tap */
.btn-main:active{transform:scale(.97);background:#d4e000;animation:btnPulseAnim .35s ease}

/* Card variants */
.card-hero{background:var(--card);border:1px solid rgba(238,255,0,.18);border-left:3px solid var(--yellow);border-radius:16px;padding:16px 16px 16px 18px;position:relative;overflow:hidden}
.card-hero::before{content:"";position:absolute;top:0;left:0;width:3px;height:100%;background:linear-gradient(180deg,var(--yellow),rgba(238,255,0,.3));border-radius:3px 0 0 3px}
.card-ghost{background:transparent;border:1px solid var(--border2);border-radius:16px;padding:16px}

/* Exercise card typography hierarchy */
.ex-name{font-family:'Barlow Condensed',sans-serif;font-size:21px;font-weight:900;letter-spacing:.8px;color:var(--text);line-height:1.1;text-transform:uppercase;margin-bottom:8px}
.ex-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.ex-rest-row{display:flex;gap:14px;margin-top:6px;padding-top:8px;border-top:1px solid var(--border)}
.ex-rest-item{display:flex;flex-direction:column;gap:2px}
.ex-rest-val{color:var(--yellow);font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:900;line-height:1}
.ex-rest-lbl{color:var(--text3);font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}

/* Section spacing */
.block-gap{margin-bottom:24px}

/* Radar enhanced */
.radar-zone-high{fill:rgba(238,255,0,.04)}
.radar-zone-mid{fill:rgba(245,158,11,.03)}
.radar-zone-low{fill:rgba(248,113,113,.03)}
.radar-poly{stroke-dasharray:2000;animation:radarDraw .8s cubic-bezier(.4,0,.2,1) forwards}
.radar-axis{stroke-dasharray:120;animation:axesDraw .5s ease forwards;animation-fill-mode:both}

/* ── Calendar Session Cards ── */
.cal-sess{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--border2);border-radius:14px;padding:14px 16px;margin-bottom:10px;transition:border-color .15s}
.cal-salle{border-left-color:#7B8CFF}
.cal-terrain{border-left-color:#4ade80}
.cal-course{border-left-color:var(--amber)}
.cal-maison{border-left-color:var(--yellow)}
.cal-repos{border-left-color:var(--border2)}
.cal-today{border-color:rgba(238,255,0,.35);background:rgba(238,255,0,.03)}
.cal-done{opacity:.45}
.cal-day-lbl{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3)}
.today-lbl{color:var(--yellow)!important;font-size:12px}
.cal-title-salle{color:#7B8CFF}
.cal-title-terrain{color:#4ade80}
.cal-title-course{color:var(--amber)}
.cal-title-maison{color:var(--yellow)}
.cal-title-repos{color:var(--text3)}
/* Calendar action buttons */
.cal-cta{display:block;width:100%;margin-top:10px;border-radius:10px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-weight:800;letter-spacing:2px;text-transform:uppercase;transition:all .15s;border:none}
.cal-cta-start{padding:13px 16px;background:var(--yellow);color:var(--bg);font-size:15px}
.cal-cta-start:active{transform:scale(.98);background:#d4e000;animation:btnPulseAnim .35s ease}
.cal-cta-skip{padding:9px 16px;background:transparent;border:1px solid var(--border2)!important;color:var(--text3);font-size:11px;letter-spacing:1.5px;margin-top:6px}
.cal-cta-skip:active{background:rgba(255,255,255,.04)}

/* ══ VISTACOACH UI UPGRADE ══════════════════════════════ */

/* 1. Background gradient global */
body {
  background: linear-gradient(180deg, #100819 0%, #0a0c10 18%, #0A0C10 100%);
  min-height: 100vh;
}
#app { position: relative; }
#hdr { background: rgba(10,8,22,.97) !important; border-bottom-color: rgba(62,37,245,.18) !important; }

/* Sections vc-section — fond cohérent avec accueil */
.vc-section {
  background: rgba(62,37,245,.045) !important;
  border-left-color: var(--purple) !important;
  backdrop-filter: blur(4px);
}

/* 2. Progress bars — plus épaisses + lueur */
.pbar { height: 7px !important; border-radius: 4px !important; overflow: hidden; }
.pfill {
  height: 100%;
  border-radius: 4px;
  transition: width .6s cubic-bezier(.4,0,.2,1) !important;
  box-shadow: 0 0 10px rgba(238,255,0,.45), 0 0 20px rgba(238,255,0,.18) !important;
}
/* Progress bar "chargée d'énergie" sur animation */
@keyframes pbarPulse {
  0%,100% { box-shadow: 0 0 8px rgba(238,255,0,.4), 0 0 18px rgba(238,255,0,.15); }
  50%      { box-shadow: 0 0 14px rgba(238,255,0,.75), 0 0 28px rgba(238,255,0,.3); }
}
.pfill-animated { animation: pbarPulse 2.2s ease infinite; }

/* 3. Score PRÉPARATION ÉLITE */
.elite-score-wrap {
  background: linear-gradient(135deg, rgba(62,37,245,.14), rgba(238,255,0,.06));
  border: 1px solid rgba(238,255,0,.22);
  border-radius: 18px;
  padding: 18px 20px 16px;
  margin-bottom: 18px;
  position: relative;
  overflow: hidden;
}
.elite-score-wrap::before {
  content: "";
  position: absolute;
  top: -40px; right: -40px;
  width: 130px; height: 130px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(238,255,0,.12) 0%, transparent 70%);
  pointer-events: none;
}
.elite-pct {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 64px;
  color: var(--yellow);
  line-height: 1;
  letter-spacing: 2px;
}
.elite-pct-sub {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 3px;
  color: rgba(238,255,0,.55);
  text-transform: uppercase;
  margin-top: 2px;
}
.elite-bar-wrap { margin-top: 10px; }

/* 4. Session type buttons — sélection forte */
.stype-btn {
  flex: 1;
  padding: 15px 4px;
  border-radius: 14px;
  border: 2px solid var(--border);
  background: var(--card);
  color: var(--text2);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  transition: all .18s cubic-bezier(.4,0,.2,1);
  -webkit-tap-highlight-color: transparent;
}
.stype-btn.selected {
  border: 3px solid var(--yellow) !important;
  background: rgba(238,255,0,.09) !important;
  color: var(--yellow) !important;
  box-shadow: 0 0 0 1px rgba(238,255,0,.18), 0 4px 18px rgba(238,255,0,.14);
}
.stype-btn span {
  font-size: 11px;
  font-weight: 800;
  font-family: 'Barlow Condensed', sans-serif;
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

/* 5. Nav bar — icône active avec lueur jaune */
.nb { transition: all .15s; }
.nb .ni { transition: filter .2s, transform .2s; }
.nb-active .ni {
  filter: drop-shadow(0 0 6px rgba(238,255,0,.7));
  transform: translateY(-1px);
}
.nb-active .nl { color: var(--yellow) !important; }
/* Indicateur lumineux sous onglet actif */
.nav-glow-dot {
  width: 22px;
  height: 3px;
  border-radius: 2px;
  background: var(--yellow);
  box-shadow: 0 0 8px rgba(238,255,0,.8), 0 0 16px rgba(238,255,0,.35);
  margin-top: 1px;
}

/* 6. Bouton TERMINER LA SÉANCE */
.btn-finish-session {
  width: 100%;
  padding: 17px;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--yellow), #d4e000);
  border: none;
  color: var(--bg);
  font-size: 16px;
  font-weight: 900;
  font-family: 'Barlow Condensed', sans-serif;
  letter-spacing: 2px;
  text-transform: uppercase;
  cursor: pointer;
  margin-top: 18px;
  position: relative;
  overflow: hidden;
  transition: all .15s;
}
.btn-finish-session:active { transform: scale(.97); }
.btn-finish-session::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent);
  transform: translateX(-100%);
}

/* Animation de succès */
@keyframes successFlash {
  0%   { background: var(--yellow); box-shadow: 0 0 0 0 rgba(238,255,0,.6); }
  25%  { background: #4ade80; box-shadow: 0 0 0 14px rgba(74,222,128,.3); }
  60%  { background: #4ade80; box-shadow: 0 0 0 28px rgba(74,222,128,0); }
  100% { background: rgba(74,222,128,.15); box-shadow: none; color: #4ade80; border: 2px solid #4ade80; }
}
.btn-finish-done {
  animation: successFlash .6s ease forwards;
  pointer-events: none;
}
@keyframes checkBounce {
  0%   { transform: scale(0) rotate(-10deg); opacity: 0; }
  60%  { transform: scale(1.2) rotate(5deg); opacity: 1; }
  100% { transform: scale(1) rotate(0deg); opacity: 1; }
}
.finish-check { display: inline-block; animation: checkBounce .4s .1s ease both; }

/* Splash animations */

  0%   { opacity:0; transform:scale(0.4); }
  60%  { opacity:1; transform:scale(1.1); }
  100% { opacity:.6; transform:scale(1); }
}

/* Background fixe radial */
body {
  background: radial-gradient(circle at 50% 0%, #1e123a 0%, #0a0c10 80%) fixed !important;
  background-attachment: fixed !important;
}

/* Glass effects */



/* Circular gauge */
.gauge-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px 0 4px;
  position: relative;
}
.gauge-ring { filter: drop-shadow(0 0 8px rgba(238,255,0,.5)); }
@keyframes gaugeGlow {
  0%,100% { filter: drop-shadow(0 0 6px rgba(238,255,0,.4)); }
  50%      { filter: drop-shadow(0 0 14px rgba(238,255,0,.8)); }
}
.gauge-ring.active { animation: gaugeGlow 2.5s ease infinite; }
.gauge-pct-text {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 42px;
  letter-spacing: 2px;
  dominant-baseline: middle;
  text-anchor: middle;
}

/* Exercise title bigger */
.ex-name {
  font-size: 26px !important;
  letter-spacing: 1px !important;
}

/* Equipment pictos */
.equip-pictos { display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 4px; }
.equip-tag {
  display:inline-flex; align-items:center; gap:4px;
  padding:3px 8px; border-radius:6px;
  background:rgba(238,255,0,.07);
  border:1px solid rgba(238,255,0,.18);
  font-size:10px; font-weight:700;
  font-family:'Barlow Condensed',sans-serif;
  letter-spacing:1px; color:var(--yellow);
  text-transform:uppercase;
}

/* Bouton Remplacer exercice */
.btn-replace-ex {
  display:inline-flex; align-items:center; gap:4px;
  padding:5px 10px; border-radius:8px;
  background:rgba(62,37,245,.1);
  border:1px solid rgba(62,37,245,.3);
  color:var(--purple2); font-size:11px; font-weight:700;
  font-family:'Barlow Condensed',sans-serif;
  letter-spacing:1px; cursor:pointer;
  transition:all .15s;
}
.btn-replace-ex:active { background:rgba(62,37,245,.2); }

/* Pack context cards */
.pack-card {
  flex:1; padding:16px 10px;
  border-radius:14px;
  border:2px solid var(--border);
  background:var(--card);
  cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:8px;
  transition:all .18s cubic-bezier(.4,0,.2,1);
  -webkit-tap-highlight-color:transparent;
}
.pack-card.selected {
  border:2px solid var(--yellow) !important;
  background:rgba(238,255,0,.07) !important;
  box-shadow:0 0 0 1px rgba(238,255,0,.15), 0 4px 18px rgba(238,255,0,.1);
}
.pack-card-icon { font-size:28px; line-height:1; }
.pack-card-label {
  font-family:'Barlow Condensed',sans-serif;
  font-size:12px; font-weight:800; letter-spacing:1.5px;
  text-transform:uppercase; text-align:center;
}
.pack-card-sub {
  font-size:10px; color:var(--text3);
  text-align:center; line-height:1.3;
  font-family:'Barlow Condensed',sans-serif;
  letter-spacing:.5px;
}

/* Spinner replace animation */
@keyframes spin { to { transform:rotate(360deg); } }
.spin { display:inline-block; animation:spin .6s linear infinite; }

function extractJSON(txt){
  if(!txt)return null;
  const clean=txt.replace(/```json/gi,"").replace(/```/g,"").trim();
  const s=clean.indexOf("{"),e=clean.lastIndexOf("}");
  if(s===-1||e<=s)return null;
  const str=clean.slice(s,e+1);
  const tryP=src=>{try{const j=JSON.parse(src);if(j.exercises&&!j.exercices)j.exercices=j.exercises;if(j&&j.titre)return j;}catch(e){}return null;};
  return tryP(str)||tryP(str.replace(/,(\s*[}\]])/g,"$1"))||null;
}

function parseDeadlinedays(str){
  if(!str)return null;
  const wm=str.match(/(\d+)\s*(semaine|sem|week)/i);
  if(wm)return parseInt(wm[1])*7;
  const months={jan:0,fév:1,fev:1,feb:1,mar:2,avr:3,apr:3,mai:4,may:4,jun:5,jul:6,aoû:7,aou:7,aug:7,sep:8,oct:9,nov:10,déc:11,dec:11};
  const mm=str.match(/(\d{1,2})[\s\/\-](\w+)[\s\/\-](\d{4})/i);
  if(mm){const mo=months[mm[2].toLowerCase().slice(0,3)];if(mo!==undefined){const d=new Date(+mm[3],mo,+mm[1]);return Math.max(0,Math.ceil((d-new Date())/86400000));}}
  const dm=str.match(/(\d{4})[\-\/](\d{1,2})[\-\/](\d{1,2})/);
  if(dm){const d=new Date(+dm[1],+dm[2]-1,+dm[3]);return Math.max(0,Math.ceil((d-new Date())/86400000));}
  return null;
}

function renderWeightCharts(){
  const log=Object.entries(S.weightLog).filter(([k,v])=>v.length>=2);
  if(log.length===0)return"";
  return`<div style="margin-bottom:20px">
    <div class="label" style="margin-bottom:10px">📈 PROGRESSION DES CHARGES</div>
    ${log.slice(0,5).map(([name,entries])=>{
      const vals=entries.slice(-8).map(e=>({d:e.date,v:e.sets.reduce((a,b)=>a+(+b||0),0)/e.sets.length}));
      const maxV=Math.max(...vals.map(v=>v.v),1);
      const minV=Math.max(0,Math.min(...vals.map(v=>v.v))-5);
      const W=260,H=60,pad=4;
      const xStep=(W-pad*2)/(vals.length-1||1);
      const pts=vals.map((v,i)=>({x:pad+i*xStep,y:H-pad-(v.v-minV)/(maxV-minV+0.01)*(H-pad*2)}));
      const polyline=pts.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
      const lastVal=vals[vals.length-1];
      const firstVal=vals[0];
      const diff=lastVal.v-firstVal.v;
      const trend=diff>0?"↑":"↓";
      const trendColor=diff>0?"var(--yellow)":"var(--red)";
      return`<div class="card" style="margin-bottom:10px;padding:14px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <div style="font-size:13px;font-weight:700;color:var(--text)">${name}</div>
          <div style="display:flex;align-items:center;gap:8px">
            <span style="color:var(--text3);font-size:11px">${vals.length} sessions</span>
            <span style="color:${trendColor};font-size:14px;font-weight:700">${trend} ${Math.abs(diff).toFixed(1)}kg</span>
          </div>
        </div>
        <svg width="100%" viewBox="0 0 ${W} ${H}" style="overflow:visible">
          <defs><linearGradient id="g${name.replace(/\s/g,'')}" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="var(--purple)" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="var(--yellow)" stop-opacity="0.9"/>
          </linearGradient></defs>
          ${[0.25,0.5,0.75].map(r=>`<line x1="${pad}" x2="${W-pad}" y1="${(H-pad)-r*(H-pad*2)}" y2="${(H-pad)-r*(H-pad*2)}" stroke="rgba(255,255,255,.06)" stroke-width="1"/>`).join("")}
          <polyline points="${polyline}" fill="none" stroke="url(#g${name.replace(/\s/g,'')})" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          ${pts.map((p,i)=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="${i===pts.length-1?"var(--yellow)":"var(--purple2)"}" stroke="var(--bg)" stroke-width="2"/>`).join("")}
          <text x="${pts[pts.length-1].x}" y="${pts[pts.length-1].y-8}" text-anchor="middle" fill="var(--yellow)" font-size="10" font-family="'Barlow Condensed'" font-weight="700">${lastVal.v.toFixed(1)}kg</text>
        </svg>
        <div style="display:flex;justify-content:space-between;margin-top:4px">
          <span style="color:var(--text3);font-size:10px">${firstVal.d}</span>
          <span style="color:var(--text3);font-size:10px">${lastVal.d}</span>
        </div>
      </div>`;
    }).join("")}
  </div>`;
}

async function _fetchAPI(model,maxTok,msgs,sys){
  let r;
  try{r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":S.apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model,max_tokens:maxTok,stream:true,system:sys||SYS(),messages:msgs})});}
  catch(e){throw new Error("📡 Erreur réseau — vérifie ta connexion");}
  if(!r.ok){try{const d=await r.json();const m=JSON.stringify(d);if(m.includes("exceeded_limit")||m.includes("credit"))throw new Error("💳 Crédit épuisé → console.anthropic.com → Billing");if(m.includes("rate_limit"))throw new Error("⏳ Limite dépassée — attends 2-3 min");if(m.includes("auth"))throw new Error("🔑 Clé API invalide");throw new Error("Erreur API "+r.status);}catch(e){throw e;}}
  const reader=r.body.getReader(),dec=new TextDecoder();
  let full="",buf="";
  try{while(true){const{done,value}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});const lines=buf.split("\n");buf=lines.pop()||"";for(const l of lines){if(!l.startsWith("data: "))continue;const d=l.slice(6).trim();if(d==="[DONE]")continue;try{const p=JSON.parse(d);if(p.type==="content_block_delta"&&p.delta?.type==="text_delta")full+=p.delta.text;}catch(pe){}}}}catch(se){reader.cancel();throw se;}
  return full;
}

let _loaderInt=null,_loaderMsgInt=null;

    el.innerHTML=`
      <div class="loader-glow"></div>
      <svg class="loader-ring" width="120" height="120" viewBox="0 0 96 96">
        <defs>
          <linearGradient id="lgrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3E25F5"/>
            <stop offset="100%" stop-color="#EEFF00"/>

        </defs>
        <circle class="loader-track" cx="48" cy="48" r="45"/>
        <circle class="loader-fill" id="lc" cx="48" cy="48" r="45"/>
      </svg>
      <div class="loader-pct" id="lpct">0%</div>
      <div class="loader-msg" id="lmsg">Initialisation...</div>
      <div class="loader-sub">VISTACOACH · SCIENCE-BASED</div>

    document.body.appendChild(el);

  const pctEl=document.getElementById("lpct");
  const msgEl=document.getElementById("lmsg");

  const step=100;
  _loaderInt=setInterval(()=>{
    // Progression rapide au début, puis ralentit vers 85%
    const remaining=85-pct;
    const inc=remaining>40?(Math.random()*3+1.5):remaining>15?(Math.random()*1.5+0.5):(Math.random()*0.3+0.05);
    pct=Math.min(85,pct+inc);
    const offset=283-(283*(pct/100));
    if(circ)circ.style.strokeDashoffset=offset;
    if(pctEl)pctEl.textContent=Math.round(pct)+"%";
  },step);
  _loaderMsgInt=setInterval(()=>{
    msgIdx=(msgIdx+1)%LOADER_MSGS.length;
    if(msgEl){msgEl.style.opacity="0";setTimeout(()=>{if(msgEl){msgEl.textContent=LOADER_MSGS[msgIdx];msgEl.style.opacity="1";}},200);}
  },2000);

}

function stripEmoji(s){return s.replace(/[\u{1F300}-\u{1FFFF}]|[\u{2600}-\u{26FF}]|[\u{2700}-\u{27BF}]|[\u{FE00}-\u{FE0F}]|[\u{1F000}-\u{1F02F}]|[\u{1F0A0}-\u{1F0FF}]|[\u{1F100}-\u{1F1FF}]|[\u{1F200}-\u{1F2FF}]|[\u{1F900}-\u{1F9FF}]|\u{231A}|\u{231B}|\u{23E9}|\u{23F0}|\u{23F3}|\u{25FD}|\u{25FE}|\u{2614}|\u{2615}|\u{2648}-\u{2653}|\u{267F}|\u{2693}|\u{26A1}|\u{26AA}|\u{26AB}|\u{26BD}|\u{26BE}|\u{26C4}|\u{26C5}|\u{26CE}|\u{26D4}|\u{26EA}|\u{26F2}|\u{26F3}|\u{26F5}|\u{26FA}|\u{26FD}|\u{2702}|\u{2705}|\u{2708}-\u{270D}|\u{270F}|\u{2712}|\u{2714}|\u{2716}|\u{271D}|\u{2721}|\u{2728}|\u{2733}|\u{2734}|\u{2744}|\u{2747}|\u{274C}|\u{274E}|\u{2753}-\u{2755}|\u{2757}|\u{2763}|\u{2764}|\u{2795}-\u{2797}|\u{27A1}|\u{27B0}|\u{27BF}|\u{2934}|\u{2935}|\u{2B05}-\u{2B07}|\u{2B1B}|\u{2B1C}|\u{2B50}|\u{2B55}|\u{3030}|\u{303D}|\u{3297}|\u{3299}/gu," ").replace(/\s+/g," ").trim();}

function inlineFmt(s){
  s=s.replace(/\*\*(.+?)\*\*/g,'<span class="vc-strong">$1</span>');
  s=s.replace(/\*([^*\n]+?)\*/g,'<em style="color:var(--text3);font-style:italic">$1</em>');
  s=s.replace(/`([^`]+)`/g,'<code style="background:rgba(123,95,255,.15);color:var(--purple2);padding:1px 6px;border-radius:4px;font-size:12px;font-family:monospace">$1</code>');
  // Badges priorité
  s=s.replace(/\b(CRITIQUE)\b/g,'<span class="vc-badge-crit">CRITIQUE</span>');
  s=s.replace(/\b(HAUTE|HIGH)\b/g,'<span class="vc-badge-high">HAUTE</span>');
  s=s.replace(/\b(MODÉRÉ|MODERATE|MOYEN)\b/g,'<span class="vc-badge-med">MODÉRÉ</span>');
  return s;
}

function parseTable(lines,start){
  // Détecter si c'est un tableau markdown: | col | col |
  if(!lines[start]||!lines[start].trim().startsWith('|'))return null;
  const rows=[];let i=start;
  while(i<lines.length&&lines[i].trim().startsWith('|')){
    const row=lines[i].trim().slice(1,-1).split('|').map(c=>c.trim());
    if(!row.every(c=>/^[-: ]+$/.test(c)))rows.push(row); // skip separator
    i++;
  }
  if(rows.length<2)return null;
  const headers=rows[0];
  const body=rows.slice(1);
  let t=`<table class="vc-table"><thead><tr>${headers.map(h=>`<th>${stripEmoji(h)}</th>`).join("")}</tr></thead><tbody>`;
  body.forEach(r=>{
    t+=`<tr>${r.map((c,ci)=>`<td class="${ci===0?"vc-td-bold":""}">${inlineFmt(c)}</td>`).join("")}</tr>`;
  });
  t+=`</tbody></table>`;
  return{html:t,end:i};
}

function renderMD(text){
  if(!text)return"";
  const lines=text.split("\n");
  let out="";
  let i=0;
  let inSection=false,sectionContent="",sectionTitle="";
  let inPhase=false,phaseContent="",phaseTitle="";
  let inList=false,listContent="";

  const flushList=()=>{if(inList){out+=`<div style="margin-bottom:12px">${listContent}</div>`;listContent="";inList=false;}};
  const flushPhase=()=>{
    if(inPhase){
      out+=`<div class="vc-phase"><div class="vc-phase-hdr">${phaseTitle}</div><div class="vc-phase-body">${phaseContent}</div></div>`;
      phaseContent="";phaseTitle="";inPhase=false;
    }
  };

  while(i<lines.length){
    const raw=lines[i];
    const l=raw.trim();

    // Table
    if(l.startsWith('|')){
      flushList();
      const tbl=parseTable(lines,i);
      if(tbl){out+=tbl.html;i=tbl.end;continue;}
    }

    // H1
    if(l.startsWith('# ')&&!l.startsWith('## ')){
      flushList();flushPhase();
      const title=stripEmoji(l.replace(/^#\s*/,''));
      out+=`<div class="vc-h1">${title}</div><div class="vc-h1-bar"></div>`;
      i++;continue;
    }

    // H2 — devient section avec bordure latérale purple
    if(l.startsWith('## ')&&!l.startsWith('### ')){
      flushList();flushPhase();
      const title=stripEmoji(l.replace(/^##\s*/,''));
      out+=`<div class="vc-section-title">${title}</div>`;
      i++;continue;
    }

    // H3 — Phase ou sous-titre
    if(l.startsWith('### ')){
      flushList();
      const title=stripEmoji(l.replace(/^###\s*/,''));
      const isPhase=/phase|étape|step|semaine/i.test(title);
      if(isPhase){
        flushPhase();
        phaseTitle=title;inPhase=true;
      } else {
        out+=`<div class="vc-sub">${title}</div>`;
      }
      i++;continue;
    }

    // Séparateur
    if(l==='---'||l==='***'){
      flushList();flushPhase();
      out+=`<div style="height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent);margin:16px 0"></div>`;
      i++;continue;
    }

    // Liste
    if(l.startsWith('- ')||l.startsWith('• ')){
      const content=inlineFmt(l.replace(/^[-•]\s*/,''));
      if(!inList){inList=true;listContent='';}
      listContent+=`<div class="vc-li"><div class="vc-li-acc"></div><div style="flex:1;font-size:13px;color:var(--text2)">${content}</div></div>`;
      i++;continue;
    }

    // Source / citation italique seule
    if((l.startsWith('*')&&l.endsWith('*')&&l.length>2)||l.toLowerCase().startsWith('source')||l.toLowerCase().startsWith('_source')){
      flushList();
      const content=l.replace(/^\*|\*$/g,'').replace(/^_source\s*:\s*/i,'');
      out+=`<div class="vc-source">Source — ${inlineFmt(content)}</div>`;
      i++;continue;
    }

    // Ligne vide
    if(!l){flushList();i++;continue;}

    // Paragraphe normal
    flushList();
    const p=inlineFmt(l);
    if(inPhase){phaseContent+=`<div class="vc-p">${p}</div>`;}
    else{out+=`<div class="vc-p">${p}</div>`;}
    i++;
  }
  flushList();flushPhase();
  return`<div class="vc-content">${out}</div>`;
}

// ── Timer ──
let timerInt=null;
function startTimer(dur,label,isLast){
  clearInterval(timerInt);
  S.timer={active:true,rem:dur,label,isLast,_dur:dur};
  updateTimer();
  timerInt=setInterval(()=>{
    S.timer.rem--;
    if(S.timer.rem<=3&&S.timer.rem>0)beep(440,.12);
    if(S.timer.rem<=0){clearInterval(timerInt);beep(880,.8);if(navigator.vibrate)navigator.vibrate([200,100,200]);S.timer.active=false;updateTimer();if(isLast&&S.runner){S.runner.exIdx++;S.runner.doneSets=[];S.runner.weights=[];}render();return;}
    updateTimer();
  },1000);
}
function stopTimer(){clearInterval(timerInt);S.timer.active=false;}
function updateTimer(){
  const{rem,_dur,label,active}=S.timer;
  const urgent=rem<=10;
  const num=document.getElementById("t-num");
  const bar=document.getElementById("t-bar");
  const overlay=document.getElementById("timer-overlay");
  if(!active){if(overlay)overlay.style.pointerEvents="none";return;}
  if(!num||!overlay){render();return;} // overlay not in DOM yet, trigger full render
  const min=Math.floor(rem/60),sec=rem%60;
  num.innerHTML=min>0?`${min}<span style="font-size:18px;color:rgba(255,255,255,.3);font-family:'Barlow Condensed',sans-serif">:${String(sec).padStart(2,"0")}</span>`:`${rem}<span style="font-size:18px;color:rgba(255,255,255,.3);font-family:'Barlow Condensed',sans-serif">s</span>`;
  num.style.color=urgent?"var(--red)":"var(--yellow)";
  if(bar){bar.style.width=Math.max(0,((_dur-rem)/_dur)*100)+"%";bar.style.background=urgent?"var(--red)":"var(--yellow)";}
  overlay.querySelector("div").style.borderColor=urgent?"rgba(248,113,113,.6)":"rgba(91,66,245,.5)";
  overlay.style.pointerEvents="all";
}

function getEquipPictos(type,nom){
  const n=(nom||"").toLowerCase();
  const pictos=[];
  if(type==="salle"||n.includes("squat")||n.includes("press")||n.includes("curl")||n.includes("rowing")){
    pictos.push({icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="12" height="12"><line x1="6" y1="12" x2="18" y2="12"/><rect x="1" y="9" width="5" height="6" rx="1.5"/><rect x="18" y="9" width="5" height="6" rx="1.5"/><line x1="6" y1="12" x2="9" y2="12" stroke-width="3.5"/><line x1="15" y1="12" x2="18" y2="12" stroke-width="3.5"/></svg>`,lbl:"HALTÈRES"});
  }
  if(type==="terrain"||n.includes("ballon")||n.includes("passe")||n.includes("dribble")||n.includes("frappe")||n.includes("tir")){
    pictos.push({icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="12" height="12"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 1 6.5 2.4M12 2v5m0 0l5.5 3.2M17.5 10.2L22 8.6M12 7L6.5 10.2M12 7V2M6.5 10.2L2 8.6M6.5 10.2v6.6m0 0L12 20m0 0l5.5-3.2M12 20v-6.6m0 0l5.5-3.2M12 13.4L6.5 16.8"/></svg>`,lbl:"BALLON"});
    pictos.push({icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="12" height="12"><polygon points="3,21 12,3 21,21"/></svg>`,lbl:"PLOTS"});
  }
  if(type==="course"||n.includes("sprint")||n.includes("fract")||n.includes("endur")){
    pictos.push({icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="12" height="12"><circle cx="12" cy="4" r="2"/><path d="M10 21v-6l-3-4 5-4 4 4-1 4"/></svg>`,lbl:"COURSE"});
  }
  if(type==="maison"||n.includes("pompe")||n.includes("gainage")||n.includes("planche")||n.includes("burpee")){
    pictos.push({icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="12" height="12"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`,lbl:"MAISON"});
  }
  if(pictos.length===0)pictos.push({icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="12" height="12"><circle cx="12" cy="8" r="4"/><path d="M8 12l-3 8M16 12l3 8M12 12v8"/></svg>`,lbl:"CORPS"});
  return pictos.map(p=>`<span class="equip-tag">${p.icon} ${p.lbl}</span>`).join("");
}

  app.innerHTML=`
    <div id="hdr">

// ── Timer Overlay (top-level, always accessible) ──
function renderTimerOverlay(){
  const t=S.timer;
  if(!t.active)return'<div id="timer-overlay" class="hidden" style="position:fixed;left:50%;transform:translateX(-50%);bottom:74px;width:calc(100% - 36px);max-width:444px;z-index:200;pointer-events:none"></div>';
  const urgent=t.rem<=10;
  const min=Math.floor(t.rem/60),sec=t.rem%60;
  const numStr=min>0?`${min}<span style="font-size:18px;color:rgba(255,255,255,.3);font-family:'Barlow Condensed',sans-serif">:${String(sec).padStart(2,"0")}</span>`:`${t.rem}<span style="font-size:18px;color:rgba(255,255,255,.3);font-family:'Barlow Condensed',sans-serif">s</span>`;
  const pct=t._dur?Math.max(0,((t._dur-t.rem)/t._dur)*100):0;
  return`<div id="timer-overlay" style="position:fixed;left:50%;transform:translateX(-50%);bottom:74px;width:calc(100% - 36px);max-width:444px;z-index:200;pointer-events:all">
    <div style="background:rgba(10,8,24,.97);border:1px solid ${urgent?'rgba(248,113,113,.6)':'rgba(91,66,245,.5)'};border-radius:16px;backdrop-filter:blur(20px);padding:13px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 -4px 28px ${urgent?'rgba(248,113,113,.22)':'rgba(62,37,245,.18)'}">
      <div style="flex:1;min-width:0">
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;color:rgba(255,255,255,.35);text-transform:uppercase;margin-bottom:3px">⏱ ${t.label||'REPOS'}</div>
        <div id="t-num" style="font-family:'Bebas Neue',sans-serif;font-size:44px;line-height:1;color:${urgent?'var(--red)':'var(--yellow)'};letter-spacing:1px">${numStr}</div>
        <div style="height:3px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;margin-top:6px">
          <div id="t-bar" style="height:100%;border-radius:2px;background:${urgent?'var(--red)':'var(--yellow)'};width:${pct}%;transition:width .9s linear"></div>
        </div>
      </div>
      <button data-action="skip-timer" style="background:none;border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.35);font-size:11px;font-weight:700;font-family:'Barlow Condensed',sans-serif;letter-spacing:1.5px;padding:9px 14px;border-radius:8px;cursor:pointer;flex-shrink:0">PASSER ›</button>
    </div>
  </div>`;
}

// ── Session Summary ──
function renderSessionSummary(){
  const r=S.runner,session=r.session;
  const elapsed=S.sessionStart?Math.floor((Date.now()-S.sessionStart)/60000):null;
  const isSalle=session.type==="salle";
  let totalVol=0;
  if(isSalle&&r.weights){
    session.exercices.forEach((ex,i)=>{
      const w=parseFloat(r.weights[i]||0);
      const reps=parseInt(ex.repetitions)||0;
      if(w>0)totalVol+=w*reps*ex.series;
    });
  }
  return`<div id="runner" style="display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:0;overflow-y:auto">
    <div style="width:100%;max-width:480px;padding:32px 20px 100px">
      <div style="text-align:center;margin-bottom:28px">
        <div style="font-size:56px;margin-bottom:10px">🏆</div>
        <h2 style="font-family:'Barlow Condensed',sans-serif;font-size:34px;font-weight:900;color:var(--yellow);letter-spacing:2px;margin-bottom:4px">SÉANCE TERMINÉE</h2>
        <p style="color:var(--text2);font-size:14px">${session.exercices.length} exercices complétés</p>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px">
        <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center">
          <div style="color:var(--text3);font-size:10px;font-family:'Barlow Condensed',sans-serif;letter-spacing:1.5px;margin-bottom:6px">EXERCICES</div>
          <div style="color:var(--yellow);font-size:32px;font-weight:900;font-family:'Barlow Condensed',sans-serif;line-height:1">${session.exercices.length}</div>
        </div>
        <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center">
          <div style="color:var(--text3);font-size:10px;font-family:'Barlow Condensed',sans-serif;letter-spacing:1.5px;margin-bottom:6px">DURÉE</div>
          <div style="color:var(--yellow);font-size:32px;font-weight:900;font-family:'Barlow Condensed',sans-serif;line-height:1">${elapsed!==null?elapsed:"–"}<span style="font-size:14px;color:var(--text2);font-weight:400">min</span></div>
        </div>
        ${isSalle&&totalVol>0?`<div style="background:var(--card);border:1px solid rgba(91,66,245,.4);border-radius:14px;padding:16px;text-align:center;grid-column:1/-1">
          <div style="color:var(--text3);font-size:10px;font-family:'Barlow Condensed',sans-serif;letter-spacing:1.5px;margin-bottom:6px">VOLUME TOTAL SOULEVÉ</div>
          <div style="color:var(--purple2);font-size:32px;font-weight:900;font-family:'Barlow Condensed',sans-serif;line-height:1">${Math.round(totalVol).toLocaleString("fr-FR")}<span style="font-size:14px;color:var(--text2);font-weight:400"> kg</span></div>
        </div>`:""}
      </div>
      <div style="margin-bottom:20px">
        <div class="label" style="margin-bottom:8px">NOTE RAPIDE</div>
        <textarea id="session-note" placeholder="RPE, sensations, douleurs, observations…" style="height:80px;margin-bottom:0">${S.sessionNote||""}</textarea>
      </div>
      <button data-action="confirm-finish" class="btn-main" style="margin-bottom:12px">✅ VALIDER ET FERMER</button>
      <button data-action="close-runner" class="btn-ghost">← RETOUR À LA SÉANCE</button>
    </div>
  </div>`;
}

// ── Onboarding Chat ──
function renderObChatContent(f){
  const msgs=S.obChat||[],loading=S.obChatL,done=S.obContextDone;
  const userCount=msgs.filter(m=>m.r==="user").length;
  let html='<div style="background:var(--surface);border-radius:14px;overflow:hidden;margin-bottom:14px">';
  if(msgs.length===0&&loading){
    html+='<div style="padding:24px;text-align:center"><span class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span></div>';
  }else if(msgs.length===0){
    html+='<div style="padding:20px;text-align:center;color:var(--text3);font-size:13px">Lancement de l&#39;entretien...</div>';
  }else{
    html+='<div style="max-height:260px;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px" id="ob-msgs">';
    msgs.forEach(function(m){
      const isU=m.r==="user";
      html+='<div style="align-self:'+(isU?"flex-end;background:var(--purple);color:#fff":"flex-start;background:var(--card);color:var(--text);border:1px solid var(--border)")
        +';padding:10px 14px;border-radius:'+(isU?"14px 14px 4px 14px":"14px 14px 14px 4px")
        +';font-size:14px;line-height:1.6;max-width:90%;white-space:pre-wrap">'+m.c+'</div>';
    });
    if(loading){html+='<div style="align-self:flex-start;background:var(--card);border:1px solid var(--border);padding:10px 14px;border-radius:14px 14px 14px 4px"><span class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span></div>';}
    html+='</div>';
  }
  if(!done){
    html+='<div style="padding:10px 12px;border-top:1px solid var(--border);display:flex;gap:8px">'
      +'<textarea id="ob-ci" placeholder="Ta réponse..." style="flex:1;min-height:44px;max-height:90px;padding:10px 12px;font-size:14px;resize:none;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text)"'+(loading?" disabled":"")+'></textarea>'
      +'<button data-action="ob-chat-send" style="padding:10px 14px;border-radius:10px;border:none;background:var(--yellow);color:var(--bg);font-size:20px;font-weight:900;cursor:pointer;align-self:flex-end"'+(loading?" disabled":"")+'">↑</button>'
      +'</div>';
  }
  html+='</div>';
  if(!done&&userCount>=3){
    html+='<button data-action="ob-extract-context" style="width:100%;padding:14px;border-radius:12px;background:var(--purple);color:#fff;font-size:14px;font-weight:800;font-family:Barlow Condensed,sans-serif;letter-spacing:1.5px;cursor:pointer;border:none;margin-bottom:12px"'+(loading?" disabled":"")+'">✨ EXTRAIRE MON CONTEXTE</button>';
  }
  if(done&&f.context){
    html+='<div style="background:rgba(62,37,245,.1);border:1px solid var(--purple);border-radius:14px;padding:16px;margin-bottom:12px">'
      +'<div class="label" style="color:var(--purple2);margin-bottom:8px">CONTEXTE EXTRAIT</div>'
      +'<p style="color:var(--text2);font-size:13px;line-height:1.7">'+f.context+'</p>'
      +'</div>';
  }
  return html;
}

async function startObChat(){
  const f=S.obForm;
  S.obChatL=true;render();
  const sys="Tu es un préparateur physique expert UEFA Elite. Entretien initial avec un footballeur pour personnaliser son programme."
    +" Profil: "+f.name+", "+f.age+" ans, "+(f.pos||"poste non défini")+", niveau "+(f.level||"inconnu")+", objectifs: "+(f.obj||[]).join(", ")+", points faibles: "+(f.weak||[]).join(", ")+"."
    +" Pose UNE seule question à la fois, courte et précise, pour comprendre:"
    +" 1) Situation de saison (fin de saison/vacances/pré-reprise/en saison)"
    +" 2) Prochaine échéance et délai"
    +" 3) Contraintes hebdomadaires réelles (temps, équipements)"
    +" 4) Etat physique et mental actuel"
    +" 5) Priorités des 8 prochaines semaines"
    +" Sois direct, bienveillant, en français. Commence par la question 1.";
  try{
    const res=await callAPIFast([{role:"user",content:"Commence l'entretien."}],sys);
    S.obChat=[{r:"assistant",c:res}];
  }catch(e){
    S.obChat=[{r:"assistant",c:"Où en es-tu dans ta saison actuellement ? (fin de saison, vacances, pré-reprise, ou en saison)"}];
  }
  S.obChatL=false;render();
  setTimeout(()=>{const el=document.getElementById("ob-msgs");if(el)el.scrollTop=el.scrollHeight;},80);
}

async function extractObContext(){
  const f=S.obForm;
  S.obChatL=true;render();
  const sys='Tu es un préparateur physique expert UEFA.';
  const history=S.obChat.map(m=>({role:m.r==="user"?"user":"assistant",content:m.c}));
  const req='Sur la base de cet entretien, génère UNIQUEMENT un paragraphe de 3 à 5 phrases résumant: la situation de saison du joueur, ses prochaines échéances, ses contraintes hebdomadaires, son état actuel et ses priorités. Ce contexte sera utilisé par un coach IA pour personnaliser chaque séance. Sois précis et actionnable. Pas de titre, juste le paragraphe.';
  try{
    const res=await callAPIFast([...history,{role:"user",content:req}],sys);
    S.obForm.context=res;
    S.obContextDone=true;
    S.obChat=[...S.obChat,{r:"assistant",c:"Parfait ! Ton contexte est prêt. Clique sur CRÉER MON PROFIL pour commencer."}];
  }catch(e){
    S.obChat=[...S.obChat,{r:"assistant",c:"Erreur: "+e.message}];
  }
  S.obChatL=false;render();
  setTimeout(()=>{const el=document.getElementById("ob-msgs");if(el)el.scrollTop=el.scrollHeight;},80);
}

// ── Onboarding ──
function pillsOB(items,sel,action,multi=false){
  return items.map(v=>{
    const on=multi?sel.includes(v):sel===v;
    return`<button class="pill ${on?"active":""}" data-action="${action}" data-val="${v}" style="margin:4px">${v}</button>`;
  }).join("");
}
function renderOB(){
  const f=S.obForm,step=S.obStep;
  const steps=[
    {title:"QUI ES-TU ?",sub:"Profil de base",valid:f.name&&f.age,content:`
      <input id="ob-name" placeholder="Ton prénom" value="${f.name}" data-ob="name" style="margin-bottom:12px">
      <input id="ob-age" type="number" placeholder="Ton âge" value="${f.age}" data-ob="age" style="margin-bottom:12px">

      <div style="display:flex;flex-wrap:wrap;gap:6px">${["2","3","4","5","6","7","8","10","12","14"].map(n=>`<button class="pill ${f.spw===n?"active":""}" data-action="ob-spw" data-val="${n}">${n}</button>`).join("")}</div>`},

        ${GOALS.map(g=>`<button class="pill ${f.bgoal===g.id?"active":""}" data-action="ob-goal" data-val="${g.id}" style="padding:14px 8px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:6px">
          <span style="font-size:24px">${g.icon}</span><span style="font-size:12px;font-weight:700;font-family:'Barlow Condensed',sans-serif;letter-spacing:1px">${g.label.toUpperCase()}</span>

      ${f.height&&f.cw?`<div class="card" style="border-color:var(--purple)">
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center">
          <div><div style="color:var(--text3);font-size:10px;font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;margin-bottom:4px">BMR</div><div style="color:var(--text);font-size:18px;font-weight:800">${calcBMR(+f.cw,+f.height,+f.age||18)}</div></div>

  ];

    <div style="padding-top:52px;margin-bottom:32px">

      <div style="color:var(--text3);font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:2.5px;margin-bottom:8px">${c.sub.toUpperCase()}</div>
      <h1 style="font-family:'Barlow Condensed',sans-serif;font-size:34px;font-weight:900;line-height:1.1;letter-spacing:1px">${c.title}</h1>
    </div>

  </div>`;
}

// ── Progress ──
function renderProgress(){
  const p=S.profile,log=S.log;
  const wk=getWk(),wt=parseInt(p.spw||3);
  const wd=log.filter(s=>s.week===wk&&s.done).length;
  const wp=Math.min(100,Math.round((wd/wt)*100));
  const wc=wp>=100?"#EEFF00":wp>=50?"var(--amber)":"var(--red)";
  const tw=parseWks(p.deadline),tt=tw?tw*wt:null;
  const td=log.filter(s=>s.done).length;
  const tp=tt?Math.min(100,Math.round((td/tt)*100)):null;

  function buildRing(pct,color,r,uid){
    const C=+(2*Math.PI*r).toFixed(2);
    const filled=+(C*(1-pct/100)).toFixed(2);
    return `<circle cx="90" cy="90" r="${r}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="9"/>
<circle id="ring-${uid}" cx="90" cy="90" r="${r}" fill="none"
  stroke="${color}" stroke-width="9" stroke-linecap="round"
  stroke-dasharray="${C}" stroke-dashoffset="${filled}"

  style="transition:stroke-dashoffset 1.1s cubic-bezier(.4,0,.2,1);

function animateCounter(id,from,to,dur=900){
  const el=document.getElementById(id);if(!el)return;
  const t0=performance.now();
  const tick=now=>{const t=Math.min((now-t0)/dur,1),e=1-Math.pow(1-t,3);el.textContent=Math.round(from+(to-from)*e);if(t<1)requestAnimationFrame(tick);};
  requestAnimationFrame(tick);
}


// ── Calendar Utilities ──
const DAY_NAMES=["DIM","LUN","MAR","MER","JEU","VEN","SAM"];
const DAY_FULL=["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
function fmtDateKey(d){return d.toISOString().split("T")[0];}
function getWeekStart(offset=0){
  const t=new Date();const dow=t.getDay();
  const mon=new Date(t);mon.setDate(t.getDate()-(dow===0?6:dow-1)+offset*7);mon.setHours(0,0,0,0);
  return mon;
}
function getWeekDays(offset=0){
  const mon=getWeekStart(offset);
  return Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d;});
}
function isToday(d){const t=new Date();return fmtDateKey(d)===fmtDateKey(t);}
function isPast(d){return d<new Date(new Date().setHours(0,0,0,0));}
function sessColorClass(type){return type==="salle"?"cal-salle":type==="terrain"?"cal-terrain":type==="course"?"cal-course":type==="maison"?"cal-maison":"cal-repos";}
function sessTitleClass(type){return type==="salle"?"cal-title-salle":type==="terrain"?"cal-title-terrain":type==="course"?"cal-title-course":type==="maison"?"cal-title-maison":"cal-title-repos";}
function sessIcon(type,size=18){

    terrain:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" width="${size}" height="${size}"><rect x="2" y="5" width="20" height="14" rx="1"/><line x1="12" y1="5" x2="12" y2="19"/><circle cx="12" cy="12" r="3"/></svg>`,
    course:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" width="${size}" height="${size}"><circle cx="15" cy="3.5" r="1.5"/><path d="M10 21l3-7 3 3 2-5"/><path d="M7 13l3-4 4 2 3-4"/></svg>`,
    maison:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" width="${size}" height="${size}"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`,
    repos:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" width="${size}" height="${size}"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`
  };return icons[type]||icons.repos;
}

function requestNotifPermission(){
  if(!("Notification" in window))return;
  if(Notification.permission==="default")Notification.requestPermission();
}
function sendNotif(title,body,icon){
  if(Notification.permission!=="granted")return;
  try{new Notification(title,{body,icon:"/favicon.ico"});}catch(e){}
}
function checkDailyNotifs(){
  if(!S.plan||!S.profile)return;
  const today=fmtDateKey(new Date());
  const todaySess=S.plan.sessions.find(s=>s.date===today&&!s.done&&!s.skipped);
  const lastKey="vc_notif_"+today;
  if(todaySess&&!localStorage.getItem(lastKey)){
    setTimeout(()=>{
      sendNotif("VISTACOACH ⚡","Séance "+todaySess.title+" prévue à "+todaySess.time+" — "+todaySess.duration+"min");
      localStorage.setItem(lastKey,"1");
    },2000);
  }
  // Missed training check
  const lastSess=S.log.filter(s=>s.done).sort((a,b)=>b.id-a.id)[0];
  if(lastSess){
    const lastDate=new Date(lastSess.id);
    const diffDays=Math.floor((Date.now()-lastDate)/(1000*60*60*24));
    const missedKey="vc_missed_"+today;
    if(diffDays>=2&&!localStorage.getItem(missedKey)&&Notification.permission==="granted"){
      setTimeout(()=>{
        sendNotif("Hey "+S.profile.name+" 👋","Ça fait "+diffDays+" jours — ta séance du jour t'attend sur VISTACOACH !");
        localStorage.setItem(missedKey,"1");
      },5000);
    }
  }
}

// ── Plan Generation ──
async function generatePlanFromAI(setup){
  const p=S.profile;
  const deadline=p.deadline||"6 semaines";
  const weeksMatch=(deadline||"").match(/(\d+)\s*(semaine|sem|week)/i);
  const weeks=Math.min(weeksMatch?parseInt(weeksMatch[1]):6,8);
  const spw=Math.min(parseInt(p.spw||3),5);
  const totalSlots=Object.values(setup.days).filter(v=>Array.isArray(v)).reduce((a,v)=>a+v.length,0)||spw;
const totalSess=totalSlots*weeks;
  const days=Object.entries(setup.days).map(([k,v])=>`${DAY_FULL[parseInt(k)]}:${(Array.isArray(v)&&v.length>0)?v.join("+"):"matin"}`).join(",");
  const startDate=fmtDateKey(new Date());
  const prompt=`Plan entrainement ${weeks} semaines. Joueur: ${p.pos||"attaquant"} ${p.level||"régional"}. Créneaux: ${days}. ${spw} séances/semaine. Début: ${startDate}.
REGLE: alterner salle/terrain/course. Repos entre séances intenses.
JSON STRICT (pas de texte autour):
{"weeks":${weeks},"sessions":[{"id":1,"date":"${startDate}","time":"07:00","type":"salle","title":"SALLE FORCE","focus":"Explosivité","duration":65,"week":1}]}
Génère les ${totalSess} séances complètes. Dates réelles à partir du ${startDate}. JSON uniquement.`;
  const txt=await callAPI([{role:"user",content:prompt}]);
  const clean=txt.replace(/\`\`\`json/gi,"").replace(/\`\`\`/g,"").trim();
  // Robust extraction
  const s=clean.indexOf("{");
  let e=clean.lastIndexOf("}");
  if(s===-1)throw new Error("Pas de JSON dans la réponse");
  let jsonStr=clean.slice(s,e+1);
  // Fix truncated JSON by closing open arrays/objects
  let parsed=null;
  try{parsed=JSON.parse(jsonStr);}
  catch(err){
    // Try to repair: find last complete session object
    const lastComma=jsonStr.lastIndexOf(",{");
    if(lastComma>0){
      let repaired=jsonStr.slice(0,lastComma)+"]}";
      try{parsed=JSON.parse(repaired);}catch(e2){}
    }
    if(!parsed)throw new Error("JSON invalide — réessaie");
  }
  if(!parsed||!parsed.sessions||parsed.sessions.length===0)throw new Error("Plan vide");
  // Assign sequential IDs
  parsed.sessions=parsed.sessions.map((s,i)=>({...s,id:i+1,done:false,skipped:false}));
  return parsed;
}

function renderProg(){
  const savedR=S._savedRunner;
  /* ── PRÉPARATION ÉLITE ── */
  const _done=S.log.filter(s=>s.done).length;
  const _spw=parseInt(S.profile.spw||3);
  const _dl=S.profile.deadline||"";
  const _wksM=_dl.match(/(\d+)\s*(semaine|sem|week)/i);
  const _wks=_wksM?parseInt(_wksM[1]):null;
  const _maxS=_wks?Math.min(_wks*_spw,60):Math.max(S.log.length,_spw*8);
  const _elite=_maxS>0?Math.min(100,Math.round((_done/_maxS)*100)):0;
  const _eColor=_elite>=80?"var(--yellow)":_elite>=50?"var(--amber)":"var(--red)";
  const _eLbl=_elite>=90?"🏆 ELITE":_elite>=70?"⚡ EN FORME":_elite>=40?"📈 EN PROGRESSION":"🔋 À CONSTRUIRE";
  const resumeBanner=savedR?`<div style="background:rgba(62,37,245,.12);border:1px solid var(--purple);border-radius:14px;padding:14px 16px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center">

      <div class="gauge-wrap">
        ${(()=>{
          const R=68, C=2*Math.PI*R, filled=C*(1-_elite/100);
          return `<svg class="gauge-ring ${_elite>0?'active':''}" width="170" height="170" viewBox="0 0 170 170">
            <defs>
              <linearGradient id="ggrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#3E25F5"/>
                <stop offset="100%" stop-color="#EEFF00"/>
              </linearGradient>
              <filter id="glow">
                <feGaussianBlur stdDeviation="3" result="blur"/>
                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>
            <circle cx="85" cy="85" r="${R}" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="10"/>
            <circle cx="85" cy="85" r="${R}" fill="none" stroke="url(#ggrad)" stroke-width="10"
              stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${filled}"
              transform="rotate(-90 85 85)" filter="url(#glow)"
              style="transition:stroke-dashoffset 1s cubic-bezier(.4,0,.2,1)"/>
            <text x="85" y="81" class="gauge-pct-text" fill="${_eColor}">${_elite}%</text>
            <text x="85" y="104" text-anchor="middle" dominant-baseline="middle" fill="rgba(255,255,255,.35)" font-size="10" font-family="'Barlow Condensed',sans-serif" font-weight="700" letter-spacing="1">${_eLbl}</text>

// ── Nutrition ──
function renderNut(){
  const p=S.profile,hasBMI=p.height&&p.cw;
  const bmr=hasBMI?calcBMR(+p.cw,+p.height,+p.age):null;
  const tdee=bmr?calcTDEE(bmr):null,tgt=tdee?calcTgt(tdee,p.bgoal):null,prot=hasBMI?calcProt(+p.cw,p.bgoal):null;
  const gInfo=GOALS.find(g=>g.id===p.bgoal);
  const today=new Date().toLocaleDateString("fr-FR",{day:"numeric",month:"short"});
  const tLog=S.foodLog.filter(e=>e.date===today);
  const totCal=tLog.reduce((a,e)=>a+(e.cal||0),0);
  const totProt=tLog.reduce((a,e)=>a+(e.prot||0),0);

        <span style="color:var(--text2);font-size:13px">${p.cw}kg → ${p.tw||"?"}kg</span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        ${[["MÉTABOLISME BASE",bmr,"kcal au repos","var(--text)"],["DÉPENSE TOTALE",tdee,"kcal avec sport","var(--text)"],["OBJECTIF JOUR",tgt,"kcal/jour","var(--yellow)"],["PROTÉINES",prot,"grammes/jour","var(--purple2)"]].map(([l,v,u,col])=>`<div style="background:var(--surface);border-radius:10px;padding:10px 8px;text-align:center">
          <div style="color:var(--text3);font-size:8px;font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:1px;margin-bottom:4px;line-height:1.2">${l}</div>
          <div style="color:${col};font-size:20px;font-weight:900;font-family:'Barlow Condensed',sans-serif;line-height:1">${v}</div>
          <div style="color:var(--text3);font-size:9px;margin-top:3px">${u}</div>
        </div>`).join("")}
      </div>
    </div>`:""}
    <!-- Food tracker -->
    <div class="card" style="margin-bottom:18px">
      <h3 class="heading" style="font-size:18px;margin-bottom:12px">🍽️ JOURNAL ALIMENTAIRE <span style="color:var(--text3);font-size:12px;font-weight:400;text-transform:none;letter-spacing:0">${today}</span></h3>
      ${totCal>0?`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">
        <div style="background:var(--surface);border-radius:10px;padding:10px;text-align:center">
          <div style="color:var(--text3);font-size:10px;font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;margin-bottom:4px">CALORIES</div>
          <div style="color:var(--yellow);font-size:22px;font-weight:900;font-family:'Barlow Condensed',sans-serif">${totCal}<span style="color:var(--text3);font-size:12px">/${tgt||"?"}kcal</span></div>
          ${tgt?`<div class="pbar" style="margin-top:6px"><div class="pfill" style="width:${Math.min(100,Math.round((totCal/tgt)*100))}%;background:${totCal>=tgt?"var(--red)":"var(--yellow)"}"></div></div>`:""}
        </div>
        <div style="background:var(--surface);border-radius:10px;padding:10px;text-align:center">
          <div style="color:var(--text3);font-size:10px;font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;margin-bottom:4px">PROTÉINES</div>

      </div>
      ${tgt&&totCal>0?`<div style="background:var(--surface);border-radius:12px;padding:12px 14px;margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <span style="color:var(--text3);font-size:10px;font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:1.5px">CALORIES RESTANTES</span>

      ${tLog.map((e,i)=>`<div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:flex-start">

// ── Tests : Scoring ──
function getAgeGroup(age){
  const a=parseInt(age)||16;
  if(a<=13)return"U13";
  if(a<=15)return"U15";
  if(a<=17)return"U17";
  return"Senior";
}
function getTestScore(testId,value,age){
  const test=ALL_TESTS.find(t=>t.id===testId);
  if(!test)return 0;
  const thresholds=test.bareme[getAgeGroup(age)];
  const val=parseFloat(value);
  if(isNaN(val)||val<0)return 0;
  if(test.dir==="lower"){
    for(let i=0;i<10;i++){if(val<=thresholds[i])return 10-i;}
    return 1;
  }else{
    for(let i=0;i<10;i++){if(val>=thresholds[i])return 10-i;}
    return 1;
  }
}

// ── Tests : Radar SVG ──
function renderRadarSVG(tests,scores,size){
  const n=tests.length,cx=size/2,cy=size/2,maxR=size*0.36;
  const aStep=(2*Math.PI)/n,aStart=-Math.PI/2;
  const ptc=(r,i)=>({x:cx+r*Math.cos(aStart+i*aStep),y:cy+r*Math.sin(aStart+i*aStep)});
  let grid="",axes="",dataStr="",dots="",labels="";
  // Background zone fills (elite=gold, mid=amber, low=red)
  [[10,'rgba(238,255,0,.05)'],[7,'rgba(245,158,11,.05)'],[4,'rgba(248,113,113,.06)']].forEach(([lvl,fill])=>{
    const r=(lvl/10)*maxR;
    const pts=tests.map((_,i)=>{const p=ptc(r,i);return p.x.toFixed(1)+","+p.y.toFixed(1);}).join(" ");
    grid+='<polygon points="'+pts+'" fill="'+fill+'" stroke="none"/>';
  });
  [2,4,6,8,10].forEach(lvl=>{
    const r=(lvl/10)*maxR;
    const pts=tests.map((_,i)=>{const p=ptc(r,i);return p.x.toFixed(1)+","+p.y.toFixed(1);}).join(" ");
    const col=lvl===10?"rgba(255,255,255,.18)":lvl===7?"rgba(245,158,11,.2)":lvl===4?"rgba(248,113,113,.2)":"rgba(255,255,255,.05)";
    grid+='<polygon points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="'+(lvl===10||lvl===7||lvl===4?1.5:0.7)+'"/>';
    if(lvl===4||lvl===7||lvl===10){
      const lp=ptc(r+4,0);
      const tc=lvl===10?"rgba(238,255,0,.5)":lvl===7?"rgba(245,158,11,.5)":"rgba(248,113,113,.5)";
      grid+='<text x="'+(lp.x+3).toFixed(1)+'" y="'+(lp.y+3).toFixed(1)+'" fill="'+tc+'" font-size="7" font-family="Barlow Condensed" font-weight="700">'+lvl+'</text>';
    }
  });
  tests.forEach((_,i)=>{
    const p=ptc(maxR,i);
    const totalLen=Math.sqrt((p.x-cx)**2+(p.y-cy)**2);
    axes+='<line x1="'+cx.toFixed(1)+'" y1="'+cy.toFixed(1)+'" x2="'+p.x.toFixed(1)+'" y2="'+p.y.toFixed(1)+'" stroke="rgba(255,255,255,.1)" stroke-width="1" stroke-dasharray="'+totalLen+'" class="radar-axis" style="animation-delay:'+(i*60)+'ms"/>';
  });
  const dataPts=tests.map((t,i)=>{const s=scores[t.id]||0;const r=(s/10)*maxR;return ptc(r,i);});
  const hasData=tests.some(t=>(scores[t.id]||0)>0);
  if(hasData){
    const pathLen=dataPts.reduce((acc,p,i)=>{const np=dataPts[(i+1)%dataPts.length];return acc+Math.sqrt((np.x-p.x)**2+(np.y-p.y)**2);},0);
    dataStr='<polygon points="'+dataPts.map(p=>p.x.toFixed(1)+","+p.y.toFixed(1)).join(" ")+'" fill="rgba(62,37,245,0.25)" stroke="#EEFF00" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="'+pathLen.toFixed(0)+'" class="radar-poly"/>';
    dataPts.forEach((p,i)=>{
      const s=scores[tests[i].id]||0;
      if(s>0){const col=s>=8?"#EEFF00":s>=5?"#f59e0b":"#f87171";dots+='<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="5" fill="'+col+'" stroke="#0A0C10" stroke-width="2.5"/>';}
    });
  }
  tests.forEach((t,i)=>{
    const lR=maxR+28;const lp=ptc(lR,i);
    const s=scores[t.id]||0;
    const sc=s>=8?"#EEFF00":s>=5?"#f59e0b":s>0?"#f87171":"rgba(255,255,255,.5)";
    const anc=lp.x<cx-8?"end":lp.x>cx+8?"start":"middle";
    const lbl=t.label.length>12?t.label.slice(0,11)+"…":t.label;
    const bw=lbl.length*5.5,bx=anc==="end"?lp.x-bw:anc==="start"?lp.x:lp.x-bw/2;
    labels+='<rect x="'+bx.toFixed(1)+'" y="'+(lp.y-14).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="13" rx="3" fill="rgba(10,12,16,.75)"/>';
    labels+='<text x="'+lp.x.toFixed(1)+'" y="'+(lp.y-4).toFixed(1)+'" text-anchor="'+anc+'" fill="rgba(255,255,255,.8)" font-size="9" font-family="Barlow Condensed" font-weight="700" letter-spacing="0.5">'+lbl.toUpperCase()+'</text>';
    if(s>0){labels+='<rect x="'+(lp.x-(anc==="middle"?11:anc==="end"?22:0)).toFixed(1)+'" y="'+(lp.y-1).toFixed(1)+'" width="22" height="13" rx="3" fill="rgba(10,12,16,.75)"/>';labels+='<text x="'+lp.x.toFixed(1)+'" y="'+(lp.y+10).toFixed(1)+'" text-anchor="'+anc+'" fill="'+sc+'" font-size="12" font-family="Barlow Condensed" font-weight="900">'+s+'</text>';}
  });
  return'<svg width="'+size+'" height="'+size+'" viewBox="-50 -50 '+(size+100)+' '+(size+100)+'" style="overflow:visible;max-width:100%">'+grid+axes+dataStr+dots+labels+'</svg>';
}

// ── PWA Icon (canvas → blob) ──
(function(){
  const LOGO_SRC = "";
  if(!LOGO_SRC) return;
  const img = new Image();
  img.crossOrigin = "anonymous";
  img.onload = function(){
    [192, 512].forEach(size => {
      const c = document.createElement('canvas');
      c.width = size; c.height = size;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#0A0C10';
      ctx.fillRect(0, 0, size, size);
      // Centrer le logo avec padding
      const pad = size * 0.1;
      ctx.drawImage(img, pad, pad, size - pad*2, size - pad*2);
      c.toBlob(blob => {
        if(!blob) return;
        const url = URL.createObjectURL(blob);
        if(size === 192){
          // Apple touch icon
          const link = document.getElementById('pwa-icon');
          if(link) link.href = url;
          // Manifest
          const manifest = {
            name: "VISTACOACH",
            short_name: "VISTACOACH",
            description: "Ton coach football IA science-based",
            start_url: ".",
            display: "standalone",
            background_color: "#0A0C10",
            theme_color: "#0A0C10",
            orientation: "portrait",
            icons: [{src: url, sizes: "192x192", type: "image/png"}]
          };
          const mBlob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
          const mUrl = URL.createObjectURL(mBlob);
          const mLink = document.getElementById('pwa-manifest');
          if(mLink) mLink.href = mUrl;
        }
      }, 'image/png');
    });
  };
  img.onerror = function(){ console.log('PWA icon: logo non chargé'); };
  img.src = LOGO_SRC;
})();
